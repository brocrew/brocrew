# The secret scan's configuration (`.github/workflows/public-checks.yml`): gitleaks' own rules, and
# the one made-up value the tree carries in a form they match.
#
# ⚑ A made-up value in a test line is allowed on its line, with `gitleaks:allow` and the reason.
# A recorded fixture cannot carry a comment, so its value is allowed here, by its exact shape.
title = "brobot"

[extend]
useDefault = true

[[allowlists]]
# False positive: the SHA-256 of storage-round-trip-auth.mjs in the historical harness manifest.
description = "historical storage harness file hash false positive"
commits = ["94d1c92a0c4a0c5ef2baacc7f1f7ad6c6bdb06c9"]

[[allowlists]]
description = "a probe's own made-up nonce, recorded in a wire fixture"
regexTarget = "match"
regexes = ['''WIRE327_\d+_\d+''']

[[allowlists]]
# The BroCrew helper extension's manifest "key" is its RSA public key, which fixes the extension's
# id in Chrome. It is public by design, so this exact value is allowed and nothing else.

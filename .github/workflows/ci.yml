# Disposable manual diagnostic only; never merge this workflow into main.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  command-popup-proof:
    name: Running command popup before and after
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the diagnostic workflow
        uses: actions/checkout@v7
        with:
          path: diag
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the before source
        uses: actions/checkout@v7
        with:
          ref: 5885ad75c8b40abd5dc1b531d5a374c8d725ffd1
          path: before
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the after source
        uses: actions/checkout@v7
        with:
          ref: 19fb95638fb4118b1a5b1ed827c9039a40e2b133
          path: after
          fetch-depth: 2
          persist-credentials: false
      - name: Record workflow and source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          {
            echo "workflow_head=$GITHUB_SHA ref=$GITHUB_REF run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow_parent=$(git -C diag rev-parse HEAD^)"
            git -C diag diff --name-only HEAD^ HEAD
            for arm in before after; do
              echo "$arm source=$(git -C "$arm" rev-parse HEAD) tree=$(git -C "$arm" rev-parse 'HEAD^{tree}')"
              git -C "$arm" status --porcelain
            done
          } | tee out/identity.txt
          test "$(git -C diag rev-parse HEAD^)" = 19fb95638fb4118b1a5b1ed827c9039a40e2b133
          test "$(git -C before rev-parse HEAD)" = 5885ad75c8b40abd5dc1b531d5a374c8d725ffd1
          test "$(git -C before rev-parse 'HEAD^{tree}')" = bc1fbcf1f46809ab6dbdcf8352ec9f0c781cfb5d
          test "$(git -C after rev-parse HEAD)" = 19fb95638fb4118b1a5b1ed827c9039a40e2b133
          test "$(git -C after rev-parse 'HEAD^{tree}')" = f3d4af348a9ba882eb33b76d01dd2f77d62636cb
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: after/package.json
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: after/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            before/pnpm-lock.yaml
            after/pnpm-lock.yaml
      - name: Install before dependencies and browser
        working-directory: before
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @brobot2/desktop exec playwright install --with-deps chromium
      - name: Install after dependencies and browser
        working-directory: after
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @brobot2/desktop exec playwright install --with-deps chromium
      - name: Run each admitted proof once
        shell: bash
        run: |
          set -euo pipefail
          node diag/.github/w4226/run-command-popup-proof.mjs --repo "$PWD/before" --pin before --sha 5885ad75c8b40abd5dc1b531d5a374c8d725ffd1 --tree bc1fbcf1f46809ab6dbdcf8352ec9f0c781cfb5d --out "$PWD/out/before" --scene "$PWD/diag/.github/w4226/command-popup-before.look.ts" --lane "GitHub hosted Linux one bounded 226.6 proof" 2>&1 | tee out/before-driver.log
          node diag/.github/w4226/run-command-popup-proof.mjs --repo "$PWD/after" --pin after --sha 19fb95638fb4118b1a5b1ed827c9039a40e2b133 --tree f3d4af348a9ba882eb33b76d01dd2f77d62636cb --out "$PWD/out/after" --scene "$PWD/diag/.github/w4226/command-popup-after.look.ts" --lane "GitHub hosted Linux one bounded 226.6 proof" 2>&1 | tee out/after-driver.log
      - name: Preserve font and browser observations
        if: always()
        shell: bash
        run: |
          mkdir -p out
          { fc-match sans-serif; fc-match system-ui; fc-list | wc -l; ls ~/.cache/ms-playwright; } > out/fonts-browser.txt 2>&1 || true
      - name: Retain logs, facts and actual images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-popup-226-proof
          path: out/
          if-no-files-found: warn
          retention-days: 14

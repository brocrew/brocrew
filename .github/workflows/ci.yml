# DISPOSABLE DIAGNOSTIC ONLY. Replaces .github/workflows/ci.yml on a disposable ref, never main.
# One manual run: the existing `CI` workflow_dispatch entry point, on a diagnostic ref.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  # The exact receiving source Sara names. Change all four together if it changes.
  TESTED_SHA: f3f41c4899bf9b3a775a6d9e625b4d4edb692571
  W7125_TESTED_SHA: f3f41c4899bf9b3a775a6d9e625b4d4edb692571
  W7125_TESTED_TREE: 5c5cf63622d3c937b588a19cff36f76ac86589fe
  W7125_TESTED_PARENT: 7944f64a9257129ceb719132d0bfb54f36e76c0c

jobs:
  w7125-proof:
    name: w7125 800px proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The diagnostic head: carries only the workflow, the driver and the proof (under .github/w7125/).
      - name: Check out the diagnostic head
        uses: actions/checkout@v7
        with:
          path: diag
          fetch-depth: 2
          persist-credentials: false

      # The tested product source: the exact cleared commit, fetched by SHA from the diagnostic ref's history.
      - name: Check out the exact tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TESTED_SHA }}
          path: src
          fetch-depth: 2
          persist-credentials: false

      - name: Identities, workflow head versus tested source
        run: |
          set -eo pipefail
          mkdir -p out
          {
            echo "workflow_head(GITHUB_SHA)=$GITHUB_SHA ref=$GITHUB_REF run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "tested_source=$(git -C src rev-parse HEAD) tree=$(git -C src rev-parse 'HEAD^{tree}')"
            git -C src cat-file commit HEAD | sed -n '1,/^$/p'
            echo "diag_parent=$(git -C diag rev-parse HEAD^)"
            echo "diag_changed_paths_vs_parent:"; git -C diag diff --name-only HEAD^ HEAD
            sha256sum diag/.github/w7125/driver.py diag/.github/w7125/w7125-proof.dom.test.ts
          } | tee out/identity.txt
          test "$(git -C src rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git -C diag rev-parse HEAD^)" = "$TESTED_SHA"
          test "$(git -C src rev-parse 'HEAD^{tree}')" = "$W7125_TESTED_TREE"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: src/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/.nvmrc
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: src
        run: pnpm install --frozen-lockfile

      - name: Install the Chromium the DOM tests run in
        working-directory: src
        run: pnpm --filter @brobot2/desktop exec playwright install --with-deps chromium

      # The corrected driver: pin check, exclusive create and cleanup of its own file, proof first,
      # existing app-frame file only if the proof passes, PNGs exported even on failure.
      - name: Run the proof, then the existing app-frame file
        id: proof
        working-directory: src
        run: |
          set -o pipefail
          python3 -I ../diag/.github/w7125/driver.py "$(base64 -w0 ../diag/.github/w7125/w7125-proof.dom.test.ts)" 2>&1 | tee ../out/driver.log

      - name: Raw fonts, browser and geometry lines
        if: always()
        run: |
          grep -E 'IDENT |GEOMETRY |DRAWER |QUEUEBAR |VIEWER |W7125_(RUN|EXIT|IDENT|CODES|TESTSHA|PNG|EXPORT_ERROR|TARGET|IDENTITY)' out/driver.log > out/geometry-and-exits.txt || true
          { fc-match sans-serif; fc-match system-ui; fc-list | wc -l; ls ~/.cache/ms-playwright; } > out/fonts-browser.txt 2>&1 || true
          mkdir -p out/png
          find src/apps/desktop -name 'w7125-*.png' -not -path '*/node_modules/*' -exec cp {} out/png/ \; || true
          sha256sum out/png/* > out/png-sha256.txt 2>/dev/null || true

      - name: Keep raw log, geometry and PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w7125-proof
          path: out/
          if-no-files-found: warn
          retention-days: 14

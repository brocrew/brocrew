name: Card 621 Chrome timing diagnostic

on:
  # By hand, on any branch that carries this file: `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. A push made while a run is going waits, and replaces any run
# already waiting, so no run is cut short and the newest commit is always the next one checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plugins:
    name: plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLUGIN_CI_NODE_VERSION: '24.22.0'
      PLUGIN_CI_PNPM_VERSION: '10.11.0'
      PLUGIN_CI_GO_VERSION: '1.27.2'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PLUGIN_CI_PNPM_VERSION }}

      - name: Setup pinned Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PLUGIN_CI_NODE_VERSION }}
          cache: pnpm

      - name: Setup pinned Go when a plugin has a module
        if: hashFiles('plugins/**/go.mod') != ''
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.PLUGIN_CI_GO_VERSION }}
          cache: false

      - name: Install frozen workspace and Chrome dependencies
        run: |
          pnpm install --frozen-lockfile
          npm --prefix plugins/chrome ci --ignore-scripts --no-audit --no-fund

      - name: Run only the instrumented off-on case
        run: |
          pnpm exec vitest run --config plugins/chrome/vitest.config.ts --retry=0 --reporter=verbose --testNamePattern='^rereads a real shared registry after external off-on while queued$' plugins/chrome/test/shared-browser-authorization.test.ts

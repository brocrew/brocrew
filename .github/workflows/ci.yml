name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test 4/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # vitest splits the files, by a hash of their paths, across every project but `dom`.
        shard: [4]
    steps:
      - &test-checkout
        uses: actions/checkout@v7
        with:
          ref: c9e8465db5ffcdb32cde4326a80967976043de1a
          persist-credentials: false

      - &test-pnpm
        name: Install pnpm
        uses: pnpm/action-setup@v6

      - &test-node
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - &test-install
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Give the runner the two CLI homes
        run: mkdir -p ~/.claude ~/.codex

      # Every project but `dom`: the DOM project runs in the `dom` job below, in groups. Run in
      # one browser per shard, its ~54 files filled the runner's disk.
      - name: vitest, every project but dom (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        run: pnpm exec vitest run --project '!dom' --shard=4/4


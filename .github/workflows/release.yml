# Candidate tags build once. Qualification seals the tested selection. The reviewed 0.2.12 proof carrier may
# verify and publish the original candidate bytes while the stable tag retains their source.
#
#   - `vX.Y.Z`        → a full release: what every BroCrew that checks for updates is offered;
#   - `vX.Y.Z-candidate.N` builds version X.Y.Z without publishing.
#
# ⚑ The version comes from the tag (`-c.extraMetadata.version`), so a release needs no commit that
# bumps a number. ⛔ Only the version: the app's name — the package's `name`, which places its data
# folder and names its Keychain entry — never moves (`apps/desktop/src/main/data-folder.ts`).
#
# ⚑ Where releases live, and where every BroCrew built here looks for its updates, is ONE setting:
# the repository variable `RELEASE_REPO` (owner/repo), else the repository this workflow runs in
# — the public repository, once there is one. ⛔ It must be that repository: the job's token publishes only
# to its own, so a release built here pointing elsewhere would offer updates nobody can publish.
#
# What each build proves before anything is published: the platform check (Codex in the app and no
# Claude Code, the newest tested Claude Code installed outside it, the database module, the data
# folder — `scripts/windows-packaged-check.mjs`,
# `scripts/macos-packaged-check.mjs`) and `scripts/release-check.mjs` — the update file names this
# version and every file it names is there, with the size and sha512 it says; the app looks at this
# repository. Each build also checks recovery through its packaged app's real entry. Only when
# both builds and their checks pass does the candidate job attest and retain the files.
# A later stable-tag dispatch publishes only the qualified bytes through the protected
# release environment, with its existing required reviewer and no-admin-bypass controls.
#
# Windows signs with DEVERP when the windows-signing environment has all four eSigner secrets.
# That environment is restricted to v* tags. Other workflows cannot read its secrets; their
# Windows builds stay unsigned. Mac releases are signed and notarized.
name: Release

on:
  push:
    tags: ['v*', '!v*-mac-signing-check.*', '!v0.2.12-proof-carrier.1']
  workflow_dispatch:
    inputs:
      mode:
        description: Qualify or publish exact tested files; the reviewed012 proof carrier preserves the stable source
        type: choice
        required: true
        options: [qualify, publish]
      selection_json:
        description: Pinned build and native proof inventory (qualify only)
        type: string
      selection_artifact_id:
        description: Immutable tested-selection artifact ID (publish only)
        type: string
      selection_sha256:
        description: SHA256 of tested-selection.json (publish only)
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: What this tag releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      repo: ${{ steps.plan.outputs.repo }}
      owner: ${{ steps.plan.outputs.owner }}
      name: ${{ steps.plan.outputs.name }}
      build: ${{ steps.plan.outputs.build }}
      qualify: ${{ steps.plan.outputs.qualify }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &node-only
        uses: ./.github/actions/setup-desktop
        with:
          install: 'false'
      - id: plan
        shell: bash
        env:
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          node scripts/release-artifacts.mjs plan >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "RELEASE_REPO is $RELEASE_REPO, but this workflow can publish only to $GITHUB_REPOSITORY"
            exit 1
          fi
          {
            echo "repo=$RELEASE_REPO"
            echo "owner=${RELEASE_REPO%%/*}"
            echo "name=${RELEASE_REPO#*/}"
          } >> "$GITHUB_OUTPUT"

  # A release carries no name the repo must not carry, in its files or their names. The patterns
  # come from the repository secret; a release run without them fails rather than skip.
  leak:
    name: No name the repo must not carry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: plan
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *node-only
      - name: The leak guard, patterns required
        env:
          BROBOT_LEAK_PATTERNS: ${{ secrets.BROBOT_LEAK_PATTERNS }}
        run: node scripts/leak-check.mjs --require-patterns

  windows:
    name: Build for Windows (NSIS, x64)
    needs: [plan, leak]
    if: needs.plan.outputs.build == 'true'
    # ⚑ `windows-2022`: pnpm's node-gyp does not know the Visual Studio of `windows-latest` (`windows.yml`).
    runs-on: windows-2022
    environment: windows-signing
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
      artifact_id: ${{ steps.assets.outputs.artifact-id }}
      artifact_digest: ${{ steps.assets.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
      # The installer carries `THIRD-PARTY-NOTICES.md`; its list of npm packages must be the one
      # this lockfile installs.
      - name: The third-party notices are up to date
        run: node scripts/third-party-notices.mjs --check
      - name: Check whether Windows signing is configured
        id: signing
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $count = @($env:ES_USERNAME, $env:ES_PASSWORD, $env:CREDENTIAL_ID, $env:ES_TOTP_SECRET).Where({ -not [string]::IsNullOrEmpty($_) }).Count
          if ($count -eq 0) { 'enabled=false' >> $env:GITHUB_OUTPUT }
          elseif ($count -eq 4) { 'enabled=true' >> $env:GITHUB_OUTPUT }
          else { throw 'Windows signing needs all four eSigner secrets, or none' }
      # Set up the pinned tool without passing it an account or making a signing call.
      - name: Set up CodeSignTool
        if: steps.signing.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@b7f8ff36fc0de8690fbbab8e5b4421d29802f747
        with:
          command: --version
          signing_method: v2
          jvm_max_memory: 1024M
      - name: Build and package (NSIS, x64)
        shell: bash
        env:
          WINDOWS_SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          set -euo pipefail
          signing=()
          if [ "$WINDOWS_SIGNING_ENABLED" = true ]; then
            signing+=(-c.win.signtoolOptions.publisherName=DEVERP)
          fi
          pnpm --filter @brobot2/desktop run build
          pnpm --filter @brobot2/desktop exec electron-builder --win nsis --x64 --config electron-builder.yml \
            -c.extraMetadata.version=${{ needs.plan.outputs.version }} \
            -c.publish.provider=github -c.publish.owner=${{ needs.plan.outputs.owner }} -c.publish.repo=${{ needs.plan.outputs.name }} \
            "${signing[@]}" --publish never
      # The app carries no Claude Code: the check runs the newest tested one, installed with npm
      # outside the app, as `windows.yml` does.
      - name: Install Claude Code (the newest tested version) outside the app
        id: claude
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/src/main/providers/claude/claude-code-tested.json').newest")"
          prefix="${RUNNER_TEMP//\\//}/claude-code"
          npm install --prefix "$prefix" --no-audit --no-fund "@anthropic-ai/claude-code@$version"
          program="$prefix/node_modules/@anthropic-ai/claude-code/bin/claude.exe"
          [ -f "$program" ] || { echo "npm installed Claude Code $version, and there is no $program"; exit 1; }
          echo "program=$program" >> "$GITHUB_OUTPUT"
          echo "Claude Code $version: $program"
      - name: Check the build (Codex and no Claude Code, the database module, the API key's way in, the data folder)
        env:
          BROBOT_CHECK_CLAUDE: ${{ steps.claude.outputs.program }}
        run: node scripts/windows-packaged-check.mjs apps/desktop/dist/win-unpacked
      - name: Check the update files (version, sizes, sha512, where the app looks)
        run: node scripts/release-check.mjs apps/desktop/dist ${{ needs.plan.outputs.version }} ${{ needs.plan.outputs.repo }} apps/desktop/dist/win-unpacked/resources/app-update.yml
      - name: Recovery real-entry check
        env:
          BROBOT_RECOVERY_EVIDENCE: ${{ runner.temp }}/recovery-evidence
        run: node scripts/recovery-real-entry-check.mjs --packaged apps/desktop/dist/win-unpacked/BroCrew.exe
      - name: Keep what the recovery check saw
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence-windows
          path: ${{ runner.temp }}/recovery-evidence
          if-no-files-found: warn
          retention-days: 14
      - id: assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            apps/desktop/dist/BroCrew-Setup-${{ needs.plan.outputs.version }}-x64.exe
            apps/desktop/dist/BroCrew-Setup-${{ needs.plan.outputs.version }}-x64.exe.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Build for the Mac (Developer ID, notarized, Apple silicon)
    needs: [plan, leak]
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15' }}
    environment: mac-signing
    timeout-minutes: 100
    outputs:
      artifact_id: ${{ steps.build.outputs.artifact_id }}
      artifact_digest: ${{ steps.build.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: build
        uses: ./.github/actions/signed-mac
        with:
          version: ${{ needs.plan.outputs.version }}
          owner: ${{ needs.plan.outputs.owner }}
          repo: ${{ needs.plan.outputs.name }}
          artifact_name: release-macos
        env:
          MAC_EXPECTED_TEAM_ID: ${{ vars.MAC_EXPECTED_TEAM_ID }}
          MAC_EXPECTED_SIGNING_AUTHORITY: ${{ vars.MAC_EXPECTED_SIGNING_AUTHORITY }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  candidate:
    name: Seal the candidate build origins and eight assets
    needs: [plan, windows, macos]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - &checked-source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - *node-only
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact_id }}
          merge-multiple: true
          path: staging/windows
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.macos.outputs.artifact_id }}
          merge-multiple: true
          path: staging/macos
      - name: Record exact build origins and final file hashes
        env:
          RELEASE_REPO: ${{ needs.plan.outputs.repo }}
          MAC_ARTIFACT_ID: ${{ needs.macos.outputs.artifact_id }}
          MAC_ARTIFACT_DIGEST: sha256:${{ needs.macos.outputs.artifact_digest }}
          WINDOWS_ARTIFACT_ID: ${{ needs.windows.outputs.artifact_id }}
          WINDOWS_ARTIFACT_DIGEST: sha256:${{ needs.windows.outputs.artifact_digest }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          set -euo pipefail
          export SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          export CANDIDATE_TAG_OBJECT="$(git rev-parse refs/tags/$GITHUB_REF_NAME)"
          mkdir -p candidate/assets
          node scripts/release-artifacts.mjs collect staging candidate/assets
      - name: Attest the final files and their build manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            candidate/assets/*
            candidate/build-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-release-${{ github.run_attempt }}
          path: candidate
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: mac-signed-candidate-receipt
          path: mac-signed-candidate.json
          if-no-files-found: error
          retention-days: 30

  qualify:
    name: Seal a mechanically verified tested selection
    needs: [plan, leak]
    if: needs.plan.outputs.qualify == 'true'
    runs-on: ubuntu-latest
    environment: mac-signing
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - *checked-source
      - *node-only
      - name: Verify source, candidate bytes, native proof origins and sealed receipts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SELECTION_JSON: ${{ inputs.selection_json }}
          MAC_EXPECTED_TEAM_ID: ${{ vars.MAC_EXPECTED_TEAM_ID }}
          MAC_EXPECTED_SIGNING_AUTHORITY: ${{ vars.MAC_EXPECTED_SIGNING_AUTHORITY }}
        run: |
          node scripts/lib/mac-signing-identity.mjs mask
          node scripts/release-selection.mjs qualify qualification
      - uses: actions/upload-artifact@v4
        with:
          name: tested-selection-${{ github.run_attempt }}
          path: qualification/tested-selection.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish only the exact tested files
    needs: [plan, leak]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The repository's required reviewer and no-admin-bypass settings remain mandatory.
    environment: release
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - *checked-source
      - *node-only
      - name: Verify the tested selection, publish a complete draft, and read every file back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ needs.plan.outputs.repo }}
          TESTED_SELECTION_ARTIFACT_ID: ${{ inputs.selection_artifact_id }}
          TESTED_SELECTION_SHA256: ${{ inputs.selection_sha256 }}
          MAC_EXPECTED_TEAM_ID: ${{ vars.MAC_EXPECTED_TEAM_ID }}
          MAC_EXPECTED_SIGNING_AUTHORITY: ${{ vars.MAC_EXPECTED_SIGNING_AUTHORITY }}
        run: |
          node scripts/lib/mac-signing-identity.mjs mask
          node scripts/release-selection.mjs publish publication
      - name: Keep the publication readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-readback-${{ github.run_attempt }}
          path: publication/publication-readback.json
          if-no-files-found: warn
          retention-days: 30

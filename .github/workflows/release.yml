# A `vX.Y.Z` tag builds and signs both platforms, runs the upgrade test on each OS with this
# run's files, and makes a draft release of exactly those files. The draft goes public when the
# `release` environment's required reviewer approves it. The upgrade test installs the latest
# published release, makes data with it, updates to this run's build and checks that the data,
# saved keys and workspaces survive; it does not cover installed plugins or older releases.
#
# The version comes from the tag (`-c.extraMetadata.version`); the package name, which places the
# data folder, never changes. Releases live in `RELEASE_REPO`, which must be this repository.
# Windows signs with DEVERP when the windows-signing environment has all four eSigner secrets.
name: Release

on:
  push:
    tags: ['v*', '!v*-mac-signing-check.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: What this tag releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      repo: ${{ steps.plan.outputs.repo }}
      owner: ${{ steps.plan.outputs.owner }}
      name: ${{ steps.plan.outputs.name }}
      predecessor: ${{ steps.plan.outputs.predecessor }}
      predecessor_source: ${{ steps.plan.outputs.predecessor_source }}
    steps:
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$GITHUB_REF_NAME is not a release tag. A release tag is vX.Y.Z."
            exit 1
          fi
          if [ "$RELEASE_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "RELEASE_REPO is $RELEASE_REPO, but this workflow can publish only to $GITHUB_REPOSITORY"
            exit 1
          fi
          predecessor="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "repo=$RELEASE_REPO"
            echo "owner=${RELEASE_REPO%%/*}"
            echo "name=${RELEASE_REPO#*/}"
            echo "predecessor=$predecessor"
            echo "predecessor_source=$(gh api "repos/$GITHUB_REPOSITORY/commits/$predecessor" --jq .sha)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${GITHUB_REF_NAME#v}; the upgrade tests start from $predecessor."

  # Publication waits for the private-name check; the names come from the repository secret.
  leak:
    name: No name the repo must not carry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: plan
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
        with:
          install: 'false'
      - name: No private name in the tree
        env:
          BROBOT_LEAK_PATTERNS: ${{ secrets.BROBOT_LEAK_PATTERNS }}
        run: node scripts/leak-check.mjs

  windows:
    name: Build for Windows (NSIS, x64)
    needs: plan
    # `windows-2022`: pnpm's node-gyp does not know the Visual Studio of `windows-latest` (`windows.yml`).
    runs-on: windows-2022
    environment: windows-signing
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
      artifact_id: ${{ steps.assets.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
      # The installer carries `THIRD-PARTY-NOTICES.md`; its list of npm packages must be the one
      # this lockfile installs.
      - name: The third-party notices are up to date
        run: node scripts/third-party-notices.mjs --check
      - name: Check whether Windows signing is configured
        id: signing
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $count = @($env:ES_USERNAME, $env:ES_PASSWORD, $env:CREDENTIAL_ID, $env:ES_TOTP_SECRET).Where({ -not [string]::IsNullOrEmpty($_) }).Count
          if ($count -eq 0) { 'enabled=false' >> $env:GITHUB_OUTPUT }
          elseif ($count -eq 4) { 'enabled=true' >> $env:GITHUB_OUTPUT }
          else { throw 'Windows signing needs all four eSigner secrets, or none' }
      # Set up the pinned tool without passing it an account or making a signing call.
      - name: Set up CodeSignTool
        if: steps.signing.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@b7f8ff36fc0de8690fbbab8e5b4421d29802f747
        with:
          command: --version
          signing_method: v2
          jvm_max_memory: 1024M
      - name: Build and package (NSIS, x64)
        shell: bash
        env:
          WINDOWS_SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          set -euo pipefail
          signing=()
          if [ "$WINDOWS_SIGNING_ENABLED" = true ]; then
            signing+=(-c.win.signtoolOptions.publisherName=DEVERP)
          fi
          pnpm --filter @brobot2/desktop run build
          pnpm --filter @brobot2/desktop exec electron-builder --win nsis --x64 --config electron-builder.yml \
            -c.extraMetadata.version=${{ needs.plan.outputs.version }} \
            -c.publish.provider=github -c.publish.owner=${{ needs.plan.outputs.owner }} -c.publish.repo=${{ needs.plan.outputs.name }} \
            "${signing[@]}" --publish never
      # The app carries no Claude Code: the check runs the newest tested one, installed with npm
      # outside the app, as `windows.yml` does.
      - name: Install Claude Code (the newest tested version) outside the app
        id: claude
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/src/main/providers/claude/claude-code-tested.json').newest")"
          prefix="${RUNNER_TEMP//\\//}/claude-code"
          npm install --prefix "$prefix" --no-audit --no-fund "@anthropic-ai/claude-code@$version"
          program="$prefix/node_modules/@anthropic-ai/claude-code/bin/claude.exe"
          [ -f "$program" ] || { echo "npm installed Claude Code $version, and there is no $program"; exit 1; }
          echo "program=$program" >> "$GITHUB_OUTPUT"
          echo "Claude Code $version: $program"
      - name: Check the build (Codex and no Claude Code, the database module, the API key's way in, the data folder)
        env:
          BROBOT_CHECK_CLAUDE: ${{ steps.claude.outputs.program }}
        run: node scripts/windows-packaged-check.mjs apps/desktop/dist/win-unpacked
      - name: Check the update files (version, sizes, sha512, where the app looks)
        run: node scripts/release-check.mjs apps/desktop/dist ${{ needs.plan.outputs.version }} ${{ needs.plan.outputs.repo }} apps/desktop/dist/win-unpacked/resources/app-update.yml
      - name: Recovery real-entry check
        env:
          BROBOT_RECOVERY_EVIDENCE: ${{ runner.temp }}/recovery-evidence
        run: node scripts/recovery-real-entry-check.mjs --packaged apps/desktop/dist/win-unpacked/BroCrew.exe
      - name: Keep what the recovery check saw
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence-windows-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-evidence
          if-no-files-found: warn
          retention-days: 14
      - id: assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ github.run_attempt }}
          path: |
            apps/desktop/dist/BroCrew-Setup-${{ needs.plan.outputs.version }}-x64.exe
            apps/desktop/dist/BroCrew-Setup-${{ needs.plan.outputs.version }}-x64.exe.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Build for the Mac (Developer ID, notarized, Apple silicon)
    needs: plan
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15' }}
    environment: mac-signing
    timeout-minutes: 100
    outputs:
      artifact_id: ${{ steps.build.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: build
        uses: ./.github/actions/signed-mac
        with:
          version: ${{ needs.plan.outputs.version }}
          owner: ${{ needs.plan.outputs.owner }}
          repo: ${{ needs.plan.outputs.name }}
          artifact_name: release-macos-${{ github.run_attempt }}
        env:
          MAC_EXPECTED_TEAM_ID: ${{ vars.MAC_EXPECTED_TEAM_ID }}
          MAC_EXPECTED_SIGNING_AUTHORITY: ${{ vars.MAC_EXPECTED_SIGNING_AUTHORITY }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  mac-upgrade:
    name: Upgrade test on the Mac
    needs: [plan, macos]
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.macos.outputs.artifact_id }}
          merge-multiple: true
          path: candidate
      - name: Download the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          PREDECESSOR: ${{ needs.plan.outputs.predecessor }}
        run: |
          gh release download "$PREDECESSOR" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-arm64.dmg' --pattern latest-mac.yml --dir predecessor
          ls -la predecessor candidate
      - name: Install it, make data in three workspaces, update to this build, and check the data
        env:
          PREDECESSOR_SOURCE: ${{ needs.plan.outputs.predecessor_source }}
        run: >-
          node scripts/mac-signed-upgrade.mjs --predecessor predecessor
          --predecessor-source "$PREDECESSOR_SOURCE" --candidate candidate
          --evidence mac-upgrade-evidence
      - name: Keep the evidence, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-upgrade-evidence-${{ github.run_attempt }}
          path: mac-upgrade-evidence
          if-no-files-found: warn
          retention-days: 14

  windows-upgrade:
    name: Upgrade test on Windows
    needs: [plan, windows]
    uses: ./.github/workflows/upgrade-path.yml
    with:
      windows_beta: ${{ needs.plan.outputs.predecessor }}
      candidate_version: ${{ needs.plan.outputs.version }}
      windows_artifact_id: ${{ needs.windows.outputs.artifact_id }}

  draft:
    name: Draft the release with this run's files
    needs: [plan, leak, windows, macos, mac-upgrade, windows-upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
        with:
          install: 'false'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact_id }},${{ needs.macos.outputs.artifact_id }}
          merge-multiple: true
          path: release
      - name: Replace any earlier draft of this version with a new one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ needs.plan.outputs.repo }}
          VERSION: ${{ needs.plan.outputs.version }}
          BROCREW_WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh api --paginate "repos/$REPO/releases" --jq ".[] | select(.tag_name == \"$tag\") | .draft" > existing
          while read -r draft; do
            if [ "$draft" != true ]; then
              echo "$tag is already published; push a new version tag."
              exit 1
            fi
            gh release delete "$tag" --repo "$REPO" --yes
          done < existing
          node scripts/beta-release.mjs notes "$tag" "$GITHUB_SHA" > notes.md
          gh release create "$tag" --repo "$REPO" --draft --verify-tag \
            --title "$(node scripts/beta-release.mjs title "$tag")" --notes-file notes.md \
            "release/BroCrew-Setup-$VERSION-x64.exe" \
            "release/BroCrew-Setup-$VERSION-x64.exe.blockmap" \
            release/latest.yml \
            "release/BroCrew-$VERSION-arm64.dmg" \
            "release/BroCrew-$VERSION-arm64.dmg.blockmap" \
            "release/BroCrew-$VERSION-arm64-mac.zip" \
            "release/BroCrew-$VERSION-arm64-mac.zip.blockmap" \
            release/latest-mac.yml

  publish:
    name: Publish the draft once the release is approved
    needs: [plan, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ needs.plan.outputs.repo }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$REPO" --draft=false --latest

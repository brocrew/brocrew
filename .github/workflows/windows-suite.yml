# The whole test suite on Windows: every project but `dom` in the four shards ci.yml runs on
# Linux, and the DOM project in its sixteen groups, each group in a browser of its own, on
# windows-2022.
#
# Only on a pushed `gate/windows-suite-*` branch, or by hand, and only in the BroCrew repository.
# It references no secret and signs in to nothing. Every test process runs in the fictional home
# the vitest configs give it (`scripts/lib/tests-run-in-a-fictional-home.mjs`), as on Linux; like
# ci.yml, it leaves `BROBOT_TESTS_START_NO_PROGRAM` unset, since many tests start git or a worker.
#
# The checkout keeps the runner's own line-ending setting, which a Windows developer's clone has
# too, and the log says what it is.
#
# Each job keeps its Vitest reports and the failing tests, with the first lines of each failure,
# as an artifact.
name: Windows suite

on:
  push:
    branches: ['gate/windows-suite-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test ${{ matrix.shard }}/4 (Windows)
    if: github.repository == 'brocrew/brocrew'
    # `windows-2022`, as windows.yml explains: installing needs a Visual Studio node-gyp knows.
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      # TEMP is the profile's own temp folder, where a person's data lives, by its long name. The
      # runner's default spells it with the short name RUNNER~1, which path checks tell apart from
      # the long one; a folder elsewhere, as `runner.temp` on D:, inherits that drive's wider access
      # list, which the owner-only checks report. The log shows the folder's access list.
      - name: Use the profile's temp folder by its long name
        shell: pwsh
        run: |
          $temp = Join-Path $env:USERPROFILE 'AppData\Local\Temp'
          if ($temp.Contains('~') -or -not (Test-Path -LiteralPath $temp -PathType Container)) {
            throw "no profile temp folder by its long name at $temp"
          }
          icacls $temp
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: How the checkout ends its lines
        run: git config --show-origin --get-all core.autocrlf || echo 'core.autocrlf is not set'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Give the runner the two CLI homes
        run: mkdir -p ~/.claude ~/.codex

      - name: vitest, every project but dom (shard ${{ matrix.shard }} of 4)
        run: |
          mkdir -p windows-suite
          pnpm exec vitest run --project '!dom' --shard=${{ matrix.shard }}/4 \
            --reporter=default --reporter=json \
            --outputFile.json=windows-suite/test-${{ matrix.shard }}.json

      - name: The failing tests
        if: always()
        run: |
          mkdir -p windows-suite
          node .github/windows-suite-failures.mjs windows-suite | tee windows-suite/failures.txt

      - name: Keep the reports with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-suite-test-${{ matrix.shard }}
          path: windows-suite/
          retention-days: 14
          if-no-files-found: warn

  dom:
    name: dom groups ${{ matrix.part }}/4 (Windows)
    if: github.repository == 'brocrew/brocrew'
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Four jobs of four groups each: the sixteen groups ci.yml runs in one job.
        part: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      # As in `test`: the profile's own temp folder, by its long name.
      - name: Use the profile's temp folder by its long name
        shell: pwsh
        run: |
          $temp = Join-Path $env:USERPROFILE 'AppData\Local\Temp'
          if ($temp.Contains('~') -or -not (Test-Path -LiteralPath $temp -PathType Container)) {
            throw "no profile temp folder by its long name at $temp"
          }
          icacls $temp
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: How the checkout ends its lines
        run: git config --show-origin --get-all core.autocrlf || echo 'core.autocrlf is not set'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `playwright` fetches no browser on install. Windows needs no system libraries for it.
      - name: Install the Chromium the DOM tests run in
        run: pnpm --filter @brobot2/desktop exec playwright install chromium

      - name: Check main and renderer share the app log
        if: matrix.part == 1
        run: |
          pnpm --filter @brobot2/desktop exec node -e "const fs=require('node:fs'); const file=require('electron'); fs.accessSync(file, fs.constants.X_OK); console.log(file)"
          node scripts/renderer-logging-probe.mjs

      # The same Vitest arguments `scripts/test-dom-in-groups.mjs` gives each group, run here
      # directly: that script starts `vitest` without a shell, which finds no `vitest.cmd` on
      # Windows.
      - name: The DOM project, four of the sixteen groups, each in its own browser
        run: |
          mkdir -p windows-suite
          failed=0
          first=$(( (${{ matrix.part }} - 1) * 4 + 1 ))
          for group in $(seq "$first" $(( first + 3 ))); do
            echo "DOM group $group of 16"
            pnpm exec vitest run --project dom --shard="$group/16" \
              --reporter=default --reporter=json \
              --outputFile.json="windows-suite/dom-$group.json" || failed=1
          done
          exit "$failed"

      - name: The failing tests
        if: always()
        run: |
          mkdir -p windows-suite
          node .github/windows-suite-failures.mjs windows-suite | tee windows-suite/failures.txt

      - name: Keep the reports with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-suite-dom-${{ matrix.part }}
          path: windows-suite/
          retention-days: 14
          if-no-files-found: warn

  chrome-native-birth:
    name: Chrome native process birth (Windows)
    if: github.repository == 'brocrew/brocrew'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '0'
      BROCREW_CHROME_TEST_ARTIFACT: ${{ runner.temp }}/chrome-native-birth
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: '10.11.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Use the profile's long temp path
        run: |
          $temp = Join-Path $env:USERPROFILE 'AppData\Local\Temp'
          if ($temp.Contains('~') -or -not (Test-Path -LiteralPath $temp -PathType Container)) {
            throw "No profile temp folder by its long name at $temp"
          }
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix plugins/chrome --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record exact source and tools
        run: |
          New-Item -ItemType Directory -Force windows-suite-native | Out-Null
          git rev-parse HEAD 'HEAD^{tree}' | Tee-Object windows-suite-native/source.txt
          node -p 'JSON.stringify({node:process.version,os:process.platform,arch:process.arch})'
          pnpm --version
          go version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --input-type=module -e "import('./plugins/chrome/node_modules/esbuild/lib/main.js').then(m => console.log('esbuild '+m.version))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute every birth helper module on native Windows
        run: |
          $modules = @(Get-ChildItem plugins/chrome/native -Filter go.mod -Recurse)
          if ($modules.Count -eq 0) { throw 'No native birth helper module selected' }
          foreach ($module in $modules) {
            $selectedJson = go -C $module.DirectoryName list -json .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $selectedJson | Tee-Object "windows-suite-native/go-$($module.Directory.Name)-selected.json"
            $selected = $selectedJson | ConvertFrom-Json
            if ('main_windows.go' -notin $selected.GoFiles -or 'main_windows_test.go' -notin $selected.TestGoFiles) {
              throw 'Native Windows helper/test files were not selected'
            }
            go -C $module.DirectoryName test -v ./... 2>&1 | Tee-Object "windows-suite-native/go-$($module.Directory.Name)-tests.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build the actual Windows package and provide its helper to unbundled tests
        run: |
          $env:BROCREW_PLUGIN_SOURCE_COMMIT = $env:GITHUB_SHA
          $env:BROCREW_GO = (Get-Command go).Source
          node plugins/chrome/build.mjs $env:BROCREW_CHROME_TEST_ARTIFACT win32-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $payload = Join-Path $env:BROCREW_CHROME_TEST_ARTIFACT 'package'
          Copy-Item (Join-Path $payload 'plugin.json') windows-suite-native/plugin.json
          Copy-Item (Join-Path $env:BROCREW_CHROME_TEST_ARTIFACT 'fixture-release.json') windows-suite-native/fixture-release.json
          New-Item -ItemType Directory -Force plugins/chrome/src/profiles/bin | Out-Null
          Copy-Item (Join-Path $payload 'bin/chrome-process-birth.exe') plugins/chrome/src/profiles/bin/chrome-process-birth.exe
          Get-FileHash (Join-Path $payload 'bin/chrome-process-birth.exe') | Format-List
      - name: Execute packaged helper against independently observed Windows process facts
        run: |
          node scripts/test/chrome-native-birth-windows.mjs $env:BROCREW_CHROME_TEST_ARTIFACT windows-suite-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute standalone Chrome compatibility and behavior tests
        run: |
          pnpm exec vitest run --config plugins/chrome/vitest.config.ts --reporter=default --reporter=json --outputFile.json=windows-suite-native/chrome.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep native selection, package and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-native-birth-windows
          path: |
            windows-suite-native/
            ${{ runner.temp }}/chrome-native-birth/package/bin/chrome-process-birth.exe
          retention-days: 14
          if-no-files-found: error

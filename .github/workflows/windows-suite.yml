# Scratch diagnostic only. This version must never merge onto the product line.
# Run once by explicit dispatch on gate/owner-diagnostic-<sha8>; no push trigger.
name: Windows suite

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-owner-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owner-diagnostic:
    name: Owner diagnostic (three files only)
    if: github.repository == 'brocrew/brocrew'
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Use the profile's temp folder by its long name
        shell: pwsh
        run: |
          $temp = Join-Path $env:USERPROFILE 'AppData\Local\Temp'
          if ($temp.Contains('~') -or -not (Test-Path -LiteralPath $temp -PathType Container)) {
            throw "no profile temp folder by its long name at $temp"
          }
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record exact source
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Give the runner the two CLI homes
        run: mkdir -p ~/.claude ~/.codex

      - name: Run only the three owner files with plain evidence
        run: |
          mkdir -p windows-owner-diagnostic
          set +e
          pnpm exec vitest run --project desktop \
            apps/desktop/test/plugin-owner-recovery.test.ts \
            apps/desktop/test/plugin-owner-held-connection.test.ts \
            apps/desktop/test/plugin-owner-self-exit.test.ts \
            --maxWorkers=2 --reporter=verbose --no-color \
            > windows-owner-diagnostic/vitest.log 2>&1
          diagnostic_exit=$?
          cat windows-owner-diagnostic/vitest.log
          echo "$diagnostic_exit" > windows-owner-diagnostic/exit-code.txt
          echo "vitest exit=$diagnostic_exit"
          exit "$diagnostic_exit"

      - name: Keep raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-owner-diagnostic
          path: windows-owner-diagnostic/
          retention-days: 14
          if-no-files-found: warn

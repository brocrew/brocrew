name: RC26 boot witness original shard diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test ${{ matrix.shard }}/4${{ matrix.part && format(' part {0}/3', matrix.part) || '' }} (Windows)
    if: github.repository == 'brocrew/brocrew'
    # `windows-2022`, as windows.yml explains: installing needs a Visual Studio node-gyp knows.
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 4, part: 2 }
    defaults:
      run:
        shell: bash
    steps:
      # TEMP is the profile's own temp folder, where a person's data lives, by its long name. The
      # runner's default spells it with the short name RUNNER~1, which path checks tell apart from
      # the long one; a folder elsewhere, as `runner.temp` on D:, inherits that drive's wider access
      # list, which the owner-only checks report. The log shows the folder's access list.
      - name: Use the profile's temp folder by its long name
        shell: pwsh
        run: |
          $temp = Join-Path $env:USERPROFILE 'AppData\Local\Temp'
          if ($temp.Contains('~') -or -not (Test-Path -LiteralPath $temp -PathType Container)) {
            throw "no profile temp folder by its long name at $temp"
          }
          icacls $temp
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: How the checkout ends its lines
        run: git config --show-origin --get-all core.autocrlf || echo 'core.autocrlf is not set'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Give the runner the two CLI homes
        run: mkdir -p ~/.claude ~/.codex

      - name: vitest, every project but dom (shard ${{ matrix.shard }} of 4)
        if: ${{ !matrix.part }}
        run: |
          mkdir -p windows-suite
          pnpm exec vitest run --project '!dom' --shard=${{ matrix.shard }}/4 \
            --reporter=default --reporter=json \
            --outputFile.json=windows-suite/test-${{ matrix.shard }}.json

      # Shard 4's files, as Vitest's own sequencer chooses them for `--shard=4/4`, and every third of
      # them in sorted order run here one file at a time; the part's list is kept with the reports.
      - name: vitest, every project but dom (shard 4 of 4, part ${{ matrix.part }} of 3, one file at a time)
        if: ${{ matrix.part }}
        run: |
          mkdir -p windows-suite
          node .github/windows-suite-part.mjs '!dom' 4/4 ${{ matrix.part }}/3 \
            windows-suite/part-${{ matrix.part }}-files.txt
          mapfile -t files < windows-suite/part-${{ matrix.part }}-files.txt
          echo "${#files[@]} files"
          # With no file named, Vitest would run every project: an empty part stops here.
          [ "${#files[@]}" -gt 0 ] || { echo 'shard 4 part ${{ matrix.part }} lists no files'; exit 1; }
          # Twenty-five files a run, in order: a Windows command line holds about 8,000 characters.
          failed=0
          for ((at = 0; at < ${#files[@]}; at += 25)); do
            pnpm exec vitest run --project '!dom' --no-file-parallelism "${files[@]:at:25}" \
              --reporter=default --reporter=json \
              --outputFile.json="windows-suite/test-4-part-${{ matrix.part }}-from-$at.json" || failed=1
          done
          exit "$failed"

      - name: Shard 4 part ${{ matrix.part }} ran exactly its list
        if: ${{ always() && matrix.part }}
        run: |
          node .github/windows-suite-part.mjs --ran windows-suite/part-${{ matrix.part }}-files.txt \
            windows-suite/test-4-part-${{ matrix.part }}-from-*.json

      - name: The failing tests
        if: always()
        run: |
          mkdir -p windows-suite
          node .github/windows-suite-failures.mjs windows-suite | tee windows-suite/failures.txt

      - name: Keep the reports with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-suite-test-${{ matrix.shard }}${{ matrix.part && format('-part-{0}', matrix.part) || '' }}
          path: windows-suite/
          retention-days: 14
          if-no-files-found: warn

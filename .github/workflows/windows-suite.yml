# Scratch diagnostic only; never merge this route onto the product line.
name: Windows suite
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coldagent-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  coldagent-diagnostic:
    name: Cold-agent capacity RED and GREEN
    if: github.repository == 'brocrew/brocrew'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Use the profile's temp folder by its long name
        shell: pwsh
        run: |
          $temp = Join-Path $env:USERPROFILE 'AppData\Local\Temp'
          if ($temp.Contains('~') -or -not (Test-Path -LiteralPath $temp -PathType Container)) {
            throw "no profile temp folder by its long name at $temp"
          }
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Retain the frozen route and its contract checker
        run: |
          mkdir -p "$RUNNER_TEMP/coldagent-diagnostic/red" "$RUNNER_TEMP/coldagent-diagnostic/green"
          git rev-parse HEAD | tee "$RUNNER_TEMP/coldagent-diagnostic/route-sha.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/coldagent-diagnostic/route-tree.txt"
          cp .github/coldagent-diagnostic-contract.mjs "$RUNNER_TEMP/coldagent-diagnostic/contract.mjs"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select exact RED source and install frozen dependencies
        run: |
          git checkout --detach 2aad4833cc2b2254ed2254eb4b9360b41753ab91
          test "$(git rev-parse HEAD)" = 2aad4833cc2b2254ed2254eb4b9360b41753ab91
          test "$(git rev-parse 'HEAD^{tree}')" = 21fa5ee26522be396e687ae722605e6a5806ab2b
          git rev-parse HEAD | tee "$RUNNER_TEMP/coldagent-diagnostic/red/source-sha.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/coldagent-diagnostic/red/source-tree.txt"
          pnpm install --frozen-lockfile
      - name: Give the runner the two CLI homes
        run: mkdir -p ~/.claude ~/.codex
      - name: RED requires the exact pre-scope observation and capacity assertion failure
        run: |
          set +e
          pnpm exec vitest run --project desktop \
            apps/desktop/test/a-cold-agent-gets-each-plugin-that-is-ready.test.ts \
            -t 'pending warmups reserve the existing route capacity until their cleanup completes' \
            --maxWorkers=2 --reporter=verbose --reporter=json --no-color \
            --outputFile.json="$RUNNER_TEMP/coldagent-diagnostic/red/report.json" \
            > "$RUNNER_TEMP/coldagent-diagnostic/red/stdout.log" \
            2> "$RUNNER_TEMP/coldagent-diagnostic/red/stderr.log"
          coldagent_red_exit=$?
          set -e
          printf '%s\n' "$coldagent_red_exit" > "$RUNNER_TEMP/coldagent-diagnostic/red/exit-code.txt"
          cat "$RUNNER_TEMP/coldagent-diagnostic/red/stdout.log"
          cat "$RUNNER_TEMP/coldagent-diagnostic/red/stderr.log" >&2
          echo "RED native vitest exit=$coldagent_red_exit"
          node "$RUNNER_TEMP/coldagent-diagnostic/contract.mjs" red "$RUNNER_TEMP/coldagent-diagnostic/red"
      - name: GREEN runs all 22 tests at the exact product candidate
        run: |
          git checkout --detach 065e2e3dcb9b07e9e85cad0d065b169a8d392158
          test "$(git rev-parse HEAD)" = 065e2e3dcb9b07e9e85cad0d065b169a8d392158
          test "$(git rev-parse 'HEAD^{tree}')" = 044652a3e4990ae38a4dba26af02726788c93590
          git rev-parse HEAD | tee "$RUNNER_TEMP/coldagent-diagnostic/green/source-sha.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/coldagent-diagnostic/green/source-tree.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
          set +e
          pnpm exec vitest run --project desktop \
            apps/desktop/test/a-cold-agent-gets-each-plugin-that-is-ready.test.ts \
            --maxWorkers=2 --reporter=verbose --reporter=json --no-color \
            --outputFile.json="$RUNNER_TEMP/coldagent-diagnostic/green/report.json" \
            > "$RUNNER_TEMP/coldagent-diagnostic/green/stdout.log" \
            2> "$RUNNER_TEMP/coldagent-diagnostic/green/stderr.log"
          coldagent_green_exit=$?
          set -e
          printf '%s\n' "$coldagent_green_exit" > "$RUNNER_TEMP/coldagent-diagnostic/green/exit-code.txt"
          cat "$RUNNER_TEMP/coldagent-diagnostic/green/stdout.log"
          cat "$RUNNER_TEMP/coldagent-diagnostic/green/stderr.log" >&2
          echo "GREEN native vitest exit=$coldagent_green_exit"
          if [ "$coldagent_green_exit" -ne 0 ]; then exit "$coldagent_green_exit"; fi
          node "$RUNNER_TEMP/coldagent-diagnostic/contract.mjs" green "$RUNNER_TEMP/coldagent-diagnostic/green"
      - name: Keep both phases' raw evidence and native exits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coldagent-diagnostic
          path: ${{ runner.temp }}/coldagent-diagnostic/
          retention-days: 14
          if-no-files-found: error

# TEST ONLY: disposable carrier for the installed-plugin Windows upgrade case. Never merge.
name: Windows installed-plugin upgrade TEST

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 0.2.11 source commit supplied by Dara
        required: true
        type: string
      installer_run_id:
        description: Dara's Windows installer run
        required: true
        type: string
      installer_artifact:
        description: Exact installer artifact name from that run
        required: true
        type: string
      installer_sha256:
        description: Exact installer SHA256 from Dara's receipt
        required: true
        type: string
      plugin_run_id:
        description: Optional unpublished plugin build run (all three plugin inputs required)
        type: string
      plugin_artifact:
        description: Exact unpublished plugin input artifact
        type: string
      plugin_receipt_sha256:
        description: SHA256 of plugin-inputs.json inside the artifact
        type: string
      test_path:
        description: Failed beta recovery or independent clean-install control
        type: choice
        options: [failed-beta-recovery, clean-install, app-upgrade-compat]
        default: failed-beta-recovery
      proof_stage:
        description: Early recipe check or final candidate proof
        type: choice
        options: [early-recipe, final-candidate]
        default: early-recipe

permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Windows published plugin test (${{ inputs.test_path }})
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_VERSION: '0.2.11'
      INSTALLER_RUN_ID: ${{ inputs.installer_run_id }}
      INSTALLER_ARTIFACT: ${{ inputs.installer_artifact }}
      EXPECTED_INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
      PLUGIN_RUN_ID: ${{ inputs.plugin_run_id }}
      PLUGIN_ARTIFACT: ${{ inputs.plugin_artifact }}
      PLUGIN_RECEIPT_SHA256: ${{ inputs.plugin_receipt_sha256 }}
      TEST_PATH: ${{ inputs.test_path }}
      PROOF_STAGE: ${{ inputs.proof_stage }}
    steps:
      - name: Use the Windows profile temp folder by its long name
        shell: pwsh
        run: |
          $temp = Join-Path $env:USERPROFILE 'AppData\Local\Temp'
          if ($temp.Contains('~') -or -not (Test-Path -LiteralPath $temp -PathType Container)) {
            throw "no profile temp folder by its long name at $temp"
          }
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV

      - name: Keep source line endings as committed
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out the reviewed TEST carrier
        uses: actions/checkout@v7
        with:
          path: carrier
          persist-credentials: false

      - name: Require an exact candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INSTALLER_RUN_ID" =~ ^[0-9]+$ ]]
          test -n "$INSTALLER_ARTIFACT"
          [[ "$EXPECTED_INSTALLER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          if [[ -n "$PLUGIN_RUN_ID$PLUGIN_ARTIFACT$PLUGIN_RECEIPT_SHA256" ]]; then
            [[ "$PLUGIN_RUN_ID" =~ ^[0-9]+$ ]]
            test -n "$PLUGIN_ARTIFACT"
            [[ "$PLUGIN_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi
          mkdir -p evidence inputs
          git -C carrier rev-parse HEAD > evidence/carrier-sha.txt
          printf '%s\n' "$CANDIDATE_SHA" > evidence/candidate-sha.txt
          printf '%s\n' "$PROOF_STAGE" > evidence/proof-stage.txt

      - name: Check out the unmodified candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: candidate/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: candidate/.nvmrc
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml

      - name: Fetch the public installer and published Windows plugins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/brocrew/brocrew/releases/tags/v0.1.36 > evidence/beta-release.json
          cp evidence/beta-release.json inputs/beta-release.json
          gh api repos/brocrew/brocrew-plugin-chrome/releases/tags/v0.1.8 > evidence/chrome-release.json
          gh api repos/brocrew/brocrew-plugin-whatsapp/releases/tags/v0.1.4 > evidence/whatsapp-release.json
          gh release download v0.1.36 --repo brocrew/brocrew --pattern BroCrew-Setup-0.1.36-x64.exe --dir inputs
          gh release download v0.1.8 --repo brocrew/brocrew-plugin-chrome --pattern chrome-win32-x64.tar.gz --dir inputs
          gh release download v0.1.4 --repo brocrew/brocrew-plugin-whatsapp --pattern whatsapp-win32-x64.tar.gz --dir inputs
          cd inputs
          printf '%s\n' \
            '856b87c2fd1306745a881f7e5e97591888695dbf9a15d784b477a85f8f35578f *BroCrew-Setup-0.1.36-x64.exe' \
            'd05363044da6b65cacfccee0149772b97c1a7e5dca83c8262bf91e70de84c8a0 *chrome-win32-x64.tar.gz' \
            '49497b4c15adffefdbc63f8490da542ebae78016975a72c6b55e4476aa3dc769 *whatsapp-win32-x64.tar.gz' > ../evidence/published-sha256.txt
          sha256sum --check ../evidence/published-sha256.txt

      - name: Fetch exact unpublished plugin inputs
        if: inputs.plugin_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plugin_run_id }}
          name: ${{ inputs.plugin_artifact }}
          path: plugin-inputs

      - name: Install observer build dependencies from the exact candidate
        working-directory: candidate
        run: pnpm install --frozen-lockfile

      - name: Check the reviewed driver syntax
        shell: bash
        run: node --check carrier/windows-plugin-upgrade.mjs

      - name: Bind the observer checkout to the candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > ../evidence/observer-source-sha.txt
          git rev-parse 'HEAD^{tree}' > ../evidence/observer-source-tree.txt

      - name: Fetch Dara's existing candidate installer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.installer_run_id }}
          name: ${{ inputs.installer_artifact }}
          path: candidate-installer

      - name: Bind existing installer bytes to the supplied receipt
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_INSTALLER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mapfile -t installers < <(find candidate-installer -type f -iname '*setup*.exe')
          test "${#installers[@]}" = 1
          printf '%s *%s\n' "$EXPECTED_INSTALLER_SHA256" "${installers[0]}" > evidence/candidate-installer-sha256.txt
          sha256sum --check evidence/candidate-installer-sha256.txt
          printf '%s\n' "${installers[0]}" > evidence/candidate-installer-original-path.txt
          wc -c < "${installers[0]}" > evidence/candidate-installer-bytes.txt
          printf '%s\n' "$INSTALLER_RUN_ID" "$INSTALLER_ARTIFACT" > evidence/candidate-artifact.txt
          mkdir candidate-normalized
          cp -- "${installers[0]}" candidate-normalized/BroCrew-Setup-0.2.11-x64.exe
          printf '%s *%s\n' "$EXPECTED_INSTALLER_SHA256" 'candidate-normalized/BroCrew-Setup-0.2.11-x64.exe' > evidence/candidate-installer-normalized-sha256.txt
          sha256sum --check evidence/candidate-installer-normalized-sha256.txt
          printf 'CANDIDATE_DIR=candidate-normalized\n' >> "$GITHUB_ENV"

      - name: Run the selected installed-plugin test path
        shell: bash
        run: |
          set -euo pipefail
          plugin_args=()
          if [[ -n "$PLUGIN_RUN_ID" ]]; then
            plugin_args=(--plugin-inputs plugin-inputs --plugin-receipt-sha256 "$PLUGIN_RECEIPT_SHA256" --plugin-run-id "$PLUGIN_RUN_ID" --plugin-artifact "$PLUGIN_ARTIFACT")
          fi
          node carrier/windows-plugin-upgrade.mjs --execute "${plugin_args[@]}" --test-path "$TEST_PATH" \
            --source-root candidate --candidate-dir "$CANDIDATE_DIR" \
            --candidate-sha "$CANDIDATE_SHA" --candidate-version "$CANDIDATE_VERSION" \
            --inputs inputs --evidence evidence

      - name: Keep plain evidence after success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-plugin-upgrade-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 7

name: Upgrade path

on:
  push:
    tags: ['upgrade-path-*']
  workflow_dispatch:
    inputs:
      recovery_proof:
        description: Run the three recovery cases with published 0.2.19
        type: boolean
        default: false
      recovery_measurement_bytes:
        description: Populated Mac measurement bytes, zero disables measurement
        type: string
        default: '0'
      windows_beta:
        description: The published Windows release or prerelease to upgrade from
        default: v0.1.6
        type: string
      mac_beta:
        description: The published Mac release or prerelease to upgrade from
        default: v0.1.6
        type: string
      candidate_version:
        description: The version the candidate is stamped with
        default: 0.1.7
        type: string
      original_run_id:
        description: Original signed release run; with both artifact IDs, reuse its files without building
        type: string
      windows_artifact_id:
        description: Original signed Windows release artifact ID
        type: string
      mac_artifact_id:
        description: Original signed Mac release artifact ID
        type: string
      candidate_source:
        description: Full source SHA embedded in the original signed candidate
        type: string
      predecessor_source:
        description: Full source SHA of the explicitly selected published predecessor
        type: string
  workflow_call:
    inputs:
      recovery_proof:
        description: Run the three recovery cases with published 0.2.19
        type: boolean
        default: false
      windows_beta:
        type: string
        required: true
      candidate_version:
        type: string
        required: true
      windows_artifact_id:
        description: An uploaded Windows installer to test instead of building one
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  WINDOWS_BETA: ${{ inputs.windows_beta || (contains(github.ref_name, '-before-the-switch-') && 'windows-beta-14' || 'v0.1.6') }}
  MAC_BETA: ${{ inputs.mac_beta || (contains(github.ref_name, '-before-the-switch-') && 'mac-beta-3' || 'v0.1.6') }}
  CANDIDATE_VERSION: ${{ inputs.candidate_version || '0.1.7' }}
  CANDIDATE_SOURCE: ${{ inputs.candidate_source || github.sha }}
  UPGRADE_PATH_CLAUDE_PORT: '9360'

concurrency:
  group: upgrade-path-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assets:
    name: Bind reused files to their original release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      binding: ${{ steps.assets.outputs.binding }}
    steps:
      - id: assets
        uses: actions/github-script@v8
        env:
          ORIGINAL_RUN: ${{ inputs.original_run_id }}
          WINDOWS_ARTIFACT: ${{ inputs.windows_artifact_id }}
          MAC_ARTIFACT: ${{ inputs.mac_artifact_id }}
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
          PREDECESSOR_SOURCE: ${{ inputs.predecessor_source }}
          RECOVERY_MODE: ${{ inputs.recovery_proof || inputs.recovery_measurement_bytes != '0' && inputs.recovery_measurement_bytes != '' }}
        with:
          script: |
            const { ORIGINAL_RUN: run, WINDOWS_ARTIFACT: windows, MAC_ARTIFACT: mac,
              CANDIDATE_SOURCE: candidate, PREDECESSOR_SOURCE: predecessor } = process.env
            const demand = (ok, message) => { if (!ok) throw new Error(message) }
            if (!run) {
              demand(!mac && !candidate && !predecessor &&
                (context.eventName !== 'workflow_dispatch' || !windows),
                'Artifact reuse needs the original run and complete candidate/predecessor inputs.')
              return
            }
            demand([run, windows, mac].every(value => /^[1-9][0-9]*$/.test(value)),
              'Reuse needs an original run and both original artifact IDs.')
            demand([candidate, predecessor].every(value => /^[0-9a-f]{40}$/.test(value)),
              'Reuse needs full candidate and predecessor source SHAs.')
            demand(process.env.RECOVERY_MODE !== 'true', 'Signed reuse is the ordinary upgrade path.')
            const repo = context.repo
            const { data: original } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: Number(run) })
            demand(original.head_sha === candidate && original.head_branch === `v${process.env.CANDIDATE_VERSION}`,
              'The original run must bind the selected candidate SHA and release version.')
            const { data: oldWindows } = await github.rest.repos.getCommit({ ...repo, ref: process.env.WINDOWS_BETA })
            const { data: oldMac } = await github.rest.repos.getCommit({ ...repo, ref: process.env.MAC_BETA })
            demand(oldWindows.sha === predecessor && oldMac.sha === predecessor,
              'Both selected predecessor tags must bind the supplied predecessor SHA.')
            for (const tag of new Set([process.env.WINDOWS_BETA, process.env.MAC_BETA])) {
              const { data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag })
              demand(!release.draft && release.tag_name === tag, 'The predecessor must be published.')
            }
            const artifacts = []
            for (const [os, id] of [['windows', windows], ['macos', mac]]) {
              const { data: artifact } = await github.rest.actions.getArtifact({ ...repo, artifact_id: Number(id) })
              demand(artifact.workflow_run?.id === Number(run) && artifact.workflow_run?.head_sha === candidate &&
                artifact.name.startsWith(`release-${os}-`) && !artifact.expired,
                `The ${os} artifact must be an original retained release output of the selected run.`)
              artifacts.push(artifact)
            }
            const binding = { harnessSource: context.sha, candidateSource: candidate,
              candidateVersion: process.env.CANDIDATE_VERSION, predecessorSource: predecessor,
              windowsPredecessor: process.env.WINDOWS_BETA, macPredecessor: process.env.MAC_BETA,
              originalRun: original, artifacts }
            core.setOutput('binding', JSON.stringify(binding))
            core.info(JSON.stringify(binding, null, 2))

  windows:
    needs: assets
    name: Windows, from the tester's beta to the candidate
    if: github.repository == 'brocrew/brocrew' && (inputs.recovery_measurement_bytes || '0') == '0'
    # `windows-2022`, as `windows.yml`: pnpm's node-gyp does not know the 2025 image's Visual Studio.
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-
      - run: pnpm install --frozen-lockfile

      - name: The check's own rules fail what they should
        run: pnpm exec vitest run --project scripts scripts/test/upgrade-path.test.mjs scripts/test/upgrade-candidate-evidence.test.mjs

      - name: Fetch the beta a tester runs, as its release publishes it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upgrade-path-beta upgrade-path-evidence
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$WINDOWS_BETA" > upgrade-path-evidence/beta-release.json
          gh release download "$WINDOWS_BETA" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-Setup-*-x64*.exe' --dir upgrade-path-beta
          ls -la upgrade-path-beta

      - name: The release's installer
        if: inputs.windows_artifact_id
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.windows_artifact_id }}
          run-id: ${{ inputs.original_run_id || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: apps/desktop/dist

      - name: Keep the original artifact binding and file inventory
        if: inputs.original_run_id
        shell: bash
        env:
          ASSET_BINDING: ${{ needs.assets.outputs.binding }}
        run: >-
          node --input-type=module -e 'import { writeFileSync, mkdirSync } from "node:fs";
          import { releaseAssetInventory } from "./scripts/lib/upgrade-candidate-evidence.mjs";
          mkdirSync("upgrade-path-evidence", {recursive:true});
          releaseAssetInventory("apps/desktop/dist",process.env.CANDIDATE_VERSION,
          process.env.RUNNER_OS === "Windows" ? "windows" : "mac",
          files => writeFileSync("upgrade-path-evidence/original-assets.json",
          JSON.stringify({binding:JSON.parse(process.env.ASSET_BINDING),files},null,2)))'

      - name: Build the candidate from this commit (NSIS, x64, unsigned)
        if: ${{ !inputs.windows_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @brobot2/desktop run build
          pnpm --filter @brobot2/desktop exec electron-builder --win nsis --x64 --config electron-builder.yml \
            -c.extraMetadata.version="$CANDIDATE_VERSION" --publish never
          ls -la apps/desktop/dist

      - name: Install Claude Code, sent to the lane's scripted model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node scripts/lib/scripted-claude.mjs version
          & ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) $version
          New-Item -ItemType Directory -Force 'C:\Program Files\ClaudeCode' | Out-Null
          node scripts/lib/scripted-claude.mjs managed-settings $env:UPGRADE_PATH_CLAUDE_PORT |
            Out-File -Encoding ascii 'C:\Program Files\ClaudeCode\managed-settings.json'
          Get-Content 'C:\Program Files\ClaudeCode\managed-settings.json'
          & "$env:USERPROFILE\.local\bin\claude.exe" --version

      - name: A certificate authority of this run's own, for the lane's stand-in API
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'
        run: |
          set -euo pipefail
          mkdir -p upgrade-path-tls
          cd upgrade-path-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=upgrade-path scratch authority' \
            -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj '/CN=api.anthropic.com' -keyout api.key -out api.csr
          printf '%s\n' 'subjectAltName=DNS:api.anthropic.com' 'basicConstraints=CA:FALSE' \
            'keyUsage=digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > api.ext
          openssl x509 -req -in api.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
            -extfile api.ext -out api.pem
          openssl verify -CAfile ca.pem api.pem

      - name: Install the beta, make data with it, install the candidate over it, and check
        shell: bash
        env:
          UPGRADE_PATH_TLS_DIR: upgrade-path-tls
          BROCREW_SKIP_UPDATE_CHECK: '1'
        run: >-
          node scripts/upgrade-path.mjs --os windows
          --beta-tag "$WINDOWS_BETA" --beta-release upgrade-path-evidence/beta-release.json
          --beta-dir upgrade-path-beta
          --candidate-dir apps/desktop/dist
          --candidate-version "$CANDIDATE_VERSION" --source-sha "$CANDIDATE_SOURCE"
          --evidence upgrade-path-evidence
          ${{ inputs.recovery_proof && '--recovery-proof' || '' }}

      - name: Keep the evidence, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-path-windows-${{ github.run_attempt }}
          path: upgrade-path-evidence
          if-no-files-found: error
          retention-days: 7

  mac:
    needs: assets
    name: Mac, from the tester's beta to the candidate
    if: github.repository == 'brocrew/brocrew' && (!inputs.windows_artifact_id || inputs.original_run_id)
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-
      - run: pnpm install --frozen-lockfile

      - name: The check's own rules fail what they should
        run: pnpm exec vitest run --project scripts scripts/test/upgrade-path.test.mjs scripts/test/upgrade-candidate-evidence.test.mjs

      - name: Fetch the beta a tester runs, as its release publishes it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upgrade-path-beta upgrade-path-evidence
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$MAC_BETA" > upgrade-path-evidence/beta-release.json
          gh release download "$MAC_BETA" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-arm64*.dmg' --pattern latest-mac.yml --dir upgrade-path-beta
          ls -la upgrade-path-beta

      - name: The original signed Mac release files
        if: inputs.original_run_id
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.mac_artifact_id }}
          run-id: ${{ inputs.original_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: apps/desktop/dist

      - name: Keep the original artifact binding and file inventory
        if: inputs.original_run_id
        shell: bash
        env:
          ASSET_BINDING: ${{ needs.assets.outputs.binding }}
        run: >-
          node --input-type=module -e 'import { writeFileSync, mkdirSync } from "node:fs";
          import { releaseAssetInventory } from "./scripts/lib/upgrade-candidate-evidence.mjs";
          mkdirSync("upgrade-path-evidence", {recursive:true});
          releaseAssetInventory("apps/desktop/dist",process.env.CANDIDATE_VERSION,
          process.env.RUNNER_OS === "Windows" ? "windows" : "mac",
          files => writeFileSync("upgrade-path-evidence/original-assets.json",
          JSON.stringify({binding:JSON.parse(process.env.ASSET_BINDING),files},null,2)))'

      # Signed ad hoc (`-c.mac.identity=-`), as the betas are: a person replaces one ad hoc app with
      # another, and the Keychain sees a different program.
      - name: Build the candidate from this commit (dmg, arm64, signed ad hoc)
        if: ${{ !inputs.original_run_id }}
        run: |
          set -euo pipefail
          pnpm --filter @brobot2/desktop run build
          pnpm --filter @brobot2/desktop exec electron-builder --mac dmg --arm64 --config electron-builder.yml \
            -c.mac.identity=- -c.extraMetadata.version="$CANDIDATE_VERSION" --publish never
          ls -la apps/desktop/dist

      - name: Install Claude Code, sent to the lane's scripted model
        if: ${{ !inputs.original_run_id }}
        run: |
          set -euo pipefail
          version=$(node scripts/lib/scripted-claude.mjs version)
          curl -fsSL https://claude.ai/install.sh | bash -s "$version"
          sudo mkdir -p '/Library/Application Support/ClaudeCode'
          node scripts/lib/scripted-claude.mjs managed-settings "$UPGRADE_PATH_CLAUDE_PORT" |
            sudo tee '/Library/Application Support/ClaudeCode/managed-settings.json'
          "$HOME/.local/bin/claude" --version

      - name: Install the beta, make data with it, replace it with the candidate, and check
        if: ${{ !inputs.original_run_id }}
        env:
          BROCREW_SKIP_UPDATE_CHECK: '1'
          RECOVERY_MEASUREMENT_BYTES: ${{ inputs.recovery_measurement_bytes || '0' }}
        run: >-
          node scripts/upgrade-path.mjs --os mac
          --recovery-measurement-bytes "$RECOVERY_MEASUREMENT_BYTES"
          --beta-tag "$MAC_BETA" --beta-release upgrade-path-evidence/beta-release.json
          --beta-dir upgrade-path-beta
          --candidate-dir apps/desktop/dist
          --candidate-version "$CANDIDATE_VERSION" --source-sha "$CANDIDATE_SOURCE"
          --evidence upgrade-path-evidence
          ${{ inputs.recovery_proof && '--recovery-proof' || '' }}

      - name: Upgrade three workspaces using the original signed Mac files
        if: inputs.original_run_id
        env:
          PREDECESSOR_SOURCE: ${{ inputs.predecessor_source }}
        run: >-
          node scripts/mac-signed-upgrade.mjs --predecessor upgrade-path-beta
          --predecessor-source "$PREDECESSOR_SOURCE" --candidate apps/desktop/dist
          --candidate-source "$CANDIDATE_SOURCE" --evidence upgrade-path-evidence

      - name: Keep the evidence, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-path-mac-${{ github.run_attempt }}
          path: upgrade-path-evidence
          if-no-files-found: error
          retention-days: 7

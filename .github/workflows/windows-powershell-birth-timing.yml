name: Windows PowerShell birth timing DIAGNOSTIC
on:
  push:
    branches: [diagnostic/windows-powershell-birth-0211]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        mode: [no-profile, default-profile]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '42407090126'
          name: brobot2-windows
          path: installer
      - name: Install exact early candidate on disposable runner without launching it
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence | Out-Null
          $installers = @(Get-ChildItem installer -Recurse -Filter '*Setup*.exe')
          if ($installers.Count -ne 1) { throw 'expected one installer' }
          $exe = $installers[0].FullName
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if ($hash -ne 'acc9610f51ce2ce3b4a9e1479d7694b8720f4d9702c856eca294bb61f60956f5') { throw 'installer hash differs' }
          $hash | Set-Content evidence/installer-sha256.txt
          $installed = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "installer exit $($installed.ExitCode)" }
      - name: Time first and warm exact birth queries in the host environment
        shell: pwsh
        run: |
          $resources = Join-Path $env:LOCALAPPDATA 'Programs/BroCrew/resources'
          $node = Join-Path $resources 'plugin-node/node.exe'
          & $node windows-powershell-birth-timing.mjs $resources '${{ matrix.mode }}' evidence
          if ($LASTEXITCODE -ne 0) { throw "timing driver exit $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-powershell-birth-${{ matrix.mode }}
          path: evidence
          if-no-files-found: error
          retention-days: 7

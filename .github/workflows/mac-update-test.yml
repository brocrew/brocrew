name: Mac automatic update rehearsal

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      build_only:
        type: boolean
        default: false
      feed_url:
        type: string
        default: http://127.0.0.1:47123/
      feed_repo:
        type: string
        default: brocrew/brocrew
      feed_private:
        type: boolean
        default: false
    secrets:
      MAC_CERT_P12_BASE64:
        required: true
      MAC_CERT_P12_PASSWORD:
        required: true
      APPLE_API_KEY_P8:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true

permissions:
  contents: read

concurrency:
  group: mac-update-rehearsal-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  build:
    name: Package signed A and B for the Mac update rehearsal
    if: github.repository == 'brocrew/brocrew'
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15' }}
    environment: mac-signing
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require a hosted Apple silicon runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = arm64
          test "$GITHUB_REPOSITORY" = brocrew/brocrew
      - uses: ./.github/actions/setup-desktop
      - name: Check the pure rehearsal helpers
        run: pnpm exec vitest run --project scripts scripts/test/mac-update-test.test.mjs scripts/test/mac-update-now-rehearsal.test.mjs scripts/test/mac-native-upgrade.test.mjs scripts/test/mac-native-workspace.test.mjs scripts/test/mac-signed-upgrade.test.mjs scripts/test/mac-update-workflow.test.mjs
      - id: feed
        env:
          REPO: ${{ inputs.feed_repo || github.repository }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          if [ "$BUILD_ONLY" = true ]; then
            echo "owner=${REPO%/*}" >> "$GITHUB_OUTPUT"
            echo "repo=${REPO#*/}" >> "$GITHUB_OUTPUT"
            echo 'dist=dist-rehearsal' >> "$GITHUB_OUTPUT"
            echo 'prefix=' >> "$GITHUB_OUTPUT"
          else
            echo 'owner=brocrew' >> "$GITHUB_OUTPUT"
            echo 'repo=brocrew' >> "$GITHUB_OUTPUT"
            echo 'dist=dist-mac-update' >> "$GITHUB_OUTPUT"
            echo 'prefix=mac-' >> "$GITHUB_OUTPUT"
          fi
      - name: Package signed A
        uses: ./.github/actions/signed-mac
        with:
          version: 0.0.98
          owner: ${{ steps.feed.outputs.owner }}
          repo: ${{ steps.feed.outputs.repo }}
          feed_url: ${{ inputs.build_only && !inputs.feed_private && (inputs.feed_url || 'http://127.0.0.1:47123/') || '' }}
          feed_private: ${{ inputs.build_only && inputs.feed_private || false }}
          marker: ${{ steps.feed.outputs.prefix }}a-${{ github.sha }}
          output: ${{ steps.feed.outputs.dist }}/a
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Package signed B
        uses: ./.github/actions/signed-mac
        with:
          version: 0.0.99
          owner: ${{ steps.feed.outputs.owner }}
          repo: ${{ steps.feed.outputs.repo }}
          feed_url: ${{ inputs.build_only && !inputs.feed_private && (inputs.feed_url || 'http://127.0.0.1:47123/') || '' }}
          feed_private: ${{ inputs.build_only && inputs.feed_private || false }}
          marker: ${{ steps.feed.outputs.prefix }}b-${{ github.sha }}
          output: ${{ steps.feed.outputs.dist }}/b
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Keep the rehearsal packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_only && 'rehearsal-macos' || 'mac-update-packages' }}
          path: |
            apps/desktop/${{ steps.feed.outputs.dist }}/*/BroCrew-*-arm64.dmg
            apps/desktop/${{ steps.feed.outputs.dist }}/*/BroCrew-*-arm64.dmg.blockmap
            apps/desktop/${{ steps.feed.outputs.dist }}/*/BroCrew-*-arm64-mac.zip
            apps/desktop/${{ steps.feed.outputs.dist }}/*/BroCrew-*-arm64-mac.zip.blockmap
            apps/desktop/${{ steps.feed.outputs.dist }}/*/latest-mac.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  rehearse:
    name: Rehearse the Mac automatic update on a fresh runner
    needs: build
    if: ${{ !inputs.build_only }}
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
      - uses: actions/download-artifact@v4
        with:
          name: mac-update-packages
          path: apps/desktop/dist-mac-update
      - name: Rehearse ZIP download and Update now across running fictional workspaces
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mac-signed-upgrade.mjs \
            --predecessor apps/desktop/dist-mac-update/a --predecessor-source "$GITHUB_SHA" \
            --candidate apps/desktop/dist-mac-update/b --candidate-source "$GITHUB_SHA" \
            --marker-a "mac-a-$GITHUB_SHA" --marker-b "mac-b-$GITHUB_SHA" \
            --evidence mac-update-results
      - name: Keep success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-automatic-update-evidence
          path: mac-update-results
          if-no-files-found: error
          retention-days: 14

name: Mac automatic update rehearsal

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MAC_CERT_P12_BASE64:
        required: true
      MAC_CERT_P12_PASSWORD:
        required: true
      APPLE_API_KEY_P8:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true

permissions:
  contents: read

concurrency:
  group: mac-update-rehearsal-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  rehearse:
    name: Package signed A and B and rehearse the Mac automatic update
    if: github.repository == 'brocrew/brocrew'
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15' }}
    environment: mac-signing
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require a hosted Apple silicon runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = arm64
          test "$GITHUB_REPOSITORY" = brocrew/brocrew
      - uses: ./.github/actions/setup-desktop
      - name: Check the pure rehearsal helpers
        run: pnpm exec vitest run --project scripts scripts/test/mac-update-test.test.mjs
      - name: Package signed A
        uses: ./.github/actions/signed-mac
        with:
          version: 0.0.98
          owner: brocrew
          repo: brocrew
          feed_url: http://127.0.0.1:47123/
          marker: mac-a-${{ github.sha }}
          output: dist-mac-update/a
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Package signed B
        uses: ./.github/actions/signed-mac
        with:
          version: 0.0.99
          owner: brocrew
          repo: brocrew
          feed_url: http://127.0.0.1:47123/
          marker: mac-b-${{ github.sha }}
          output: dist-mac-update/b
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Rehearse ZIP download and Squirrel restart on fictional data
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mac-update-test.mjs \
            --dist-a apps/desktop/dist-mac-update/a \
            --dist-b apps/desktop/dist-mac-update/b \
            --feed-url http://127.0.0.1:47123/ --serve-local \
            --marker-a "mac-a-$GITHUB_SHA" --marker-b "mac-b-$GITHUB_SHA" \
            --source-sha "$GITHUB_SHA" --evidence mac-update-results
      - name: Keep success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-automatic-update-evidence
          path: mac-update-results
          if-no-files-found: error
          retention-days: 14

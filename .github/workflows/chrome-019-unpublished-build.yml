name: Chrome 0.1.9 unpublished normal build
on:
  push:
    branches: [diagnostic/chrome-019-unpublished-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROCREW_PLUGIN_SOURCE_COMMIT: 5ba484269abbf65287dea3c3611eb3f4157520ba
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5ba484269abbf65287dea3c3611eb3f4157520ba
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install declared Chrome build dependencies
        run: npm ci --prefix plugins/chrome --no-audit --no-fund
      - name: Build unchanged normal release artifacts from the exact unpublished source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BROCREW_PLUGIN_SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          export BROCREW_MONOREPO_ROOT="$PWD"
          node scripts/build-plugin-release.mjs chrome "$RUNNER_TEMP/chrome-019-release"
      - name: Retain byte-exact archive, manifest, normal catalogue entry and input receipt
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const built = path.join(process.env.RUNNER_TEMP, 'chrome-019-release');
          const out = path.join(process.env.RUNNER_TEMP, 'chrome-019-inputs');
          fs.mkdirSync(out);
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const entry = JSON.parse(fs.readFileSync(path.join(built, 'plugin-list-entry.json')));
          const archiveFilename = 'chrome-win32-x64.tar.gz';
          const archive = fs.readFileSync(path.join(built, archiveFilename));
          const manifest = fs.readFileSync(path.join(built, 'chrome-win32-x64/package/plugin.json'));
          const manifestFilename = 'chrome-win32-x64.plugin.json';
          const receipt = {
            format: 1,
            plugins: [{ id: 'chrome', version: entry.version, sourceCommit: entry.sourceCommit,
              archiveFilename, archiveBytes: archive.length, archiveSha256: sha(archive),
              manifestFilename, manifestSha256: sha(manifest), catalogueEntry: entry }],
            sourceTree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
          };
          for (const filename of [archiveFilename, 'chrome-darwin-arm64.tar.gz', 'plugin-list-entry.json', 'source-receipt.json'])
            fs.copyFileSync(path.join(built, filename), path.join(out, filename));
          fs.writeFileSync(path.join(out, manifestFilename), manifest);
          const json = JSON.stringify(receipt, null, 2) + '\n';
          fs.writeFileSync(path.join(out, 'plugin-inputs.json'), json);
          fs.writeFileSync(path.join(out, 'plugin-inputs.sha256'), sha(json) + ' *plugin-inputs.json\n');
          console.log(json);
          console.log('receiptSha256=' + sha(json));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-019-unpublished-inputs
          path: ${{ runner.temp }}/chrome-019-inputs
          if-no-files-found: error
          retention-days: 7

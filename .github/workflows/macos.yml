name: macOS
on: workflow_dispatch

permissions:
  contents: read

jobs:
  profile-hooks:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 124e7622bd417b578ddee7c30fcae989925047ac
          path: donor
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: 7335ac457b803206f0bce1afb6eb3bf93a43ced0
          path: proof
          fetch-depth: 2
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: donor/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: donor/.nvmrc
          cache: pnpm
          cache-dependency-path: donor/pnpm-lock.yaml

      - name: Verify source and package the disposable bundle
        working-directory: donor
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = 124e7622bd417b578ddee7c30fcae989925047ac
          test "$(git rev-parse 'HEAD^{tree}')" = 3b46145358302e3018dd6aeb1c1e0e56016b3baa
          test -z "$(git status --porcelain)"
          git rev-parse HEAD 'HEAD^{tree}'
          pnpm install --frozen-lockfile
          pnpm --filter @brobot2/desktop run prepare:plugin-node
          pnpm --filter @brobot2/desktop run build
          pnpm --filter @brobot2/desktop exec electron-builder \
            --mac --arm64 --dir --config electron-builder.yml -c.mac.identity=- \
            -c.appId=com.brocrew.proof.profilehooks --publish never
          test -d apps/desktop/dist/mac-arm64/BroCrew.app

      - name: Run the reviewed native hook and renderer fixture
        working-directory: proof
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7335ac457b803206f0bce1afb6eb3bf93a43ced0
          test "$(git rev-parse 'HEAD^{tree}')" = 726204d2660f0f007862e50b647c7bac83841b26
          test "$(git rev-parse HEAD^)" = 124e7622bd417b578ddee7c30fcae989925047ac
          git rev-parse HEAD 'HEAD^{tree}'
          fixture_install_home=$(mktemp -d "$RUNNER_TEMP/profile-hooks-cli.XXXXXX")
          (
            pinned_version=$(node scripts/lib/scripted-claude.mjs version)
            test "$pinned_version" = 2.1.287
            export HOME="$fixture_install_home" CFFIXED_USER_HOME="$fixture_install_home"
            curl -fsSL https://claude.ai/install.sh | bash -s "$pinned_version"
          )
          node scripts/packaged-profile-hooks.mjs \
            "$GITHUB_WORKSPACE/donor/apps/desktop/dist/mac-arm64/BroCrew.app" \
            "$fixture_install_home/.local/bin/claude" \
            "$RUNNER_TEMP/profile-hooks-evidence"

      - name: Keep proof receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profile-hooks-proof
          path: ${{ runner.temp }}/profile-hooks-evidence
          if-no-files-found: warn

name: macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  process-native:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE: ${{ runner.temp }}/process-native
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 24efa85d3c9b696029bce637a88499d87db5f0b5
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Darwin command cleanup control
        run: |
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$EVIDENCE/source.txt"
          pnpm exec vitest run --project desktop apps/desktop/test/command-cleanup.test.ts --reporter=verbose --reporter=json --outputFile.json="$EVIDENCE/darwin.json"
      - name: Build packaged app from the selected source
        run: pnpm --filter @brobot2/desktop package:mac-beta --publish never
      - name: Install pinned real Claude CLI and existing managed fixture route
        run: |
          set -euo pipefail
          version=$(node scripts/lib/scripted-claude.mjs version)
          test "$version" = 2.1.287
          curl -fsSL https://claude.ai/install.sh | bash -s "$version"
          test ! -e '/Library/Application Support/ClaudeCode/managed-settings.json'
          sudo mkdir -p '/Library/Application Support/ClaudeCode'
          node scripts/lib/scripted-claude.mjs managed-settings 47261 | sudo tee '/Library/Application Support/ClaudeCode/managed-settings.json'
          "$HOME/.local/bin/claude" --version | tee "$EVIDENCE/cli-version.txt"
      - name: Bind the actual packaged artifact and reviewed native recipe
        run: |
          node --input-type=module <<'MANIFEST'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import cp from 'node:child_process';
          const root=process.cwd(), out=process.env.EVIDENCE;
          const apps=fs.readdirSync('apps/desktop/dist',{recursive:true}).filter(x=>x.endsWith('.app') && !x.includes('.app/'));
          if(apps.length!==1)throw Error('Expected exactly one packaged app: '+apps);
          const app=fs.realpathSync(path.join(root,'apps/desktop/dist',apps[0]));
          const plist=path.join(app,'Contents/Info.plist');
          const exe=cp.execFileSync('/usr/libexec/PlistBuddy',['-c','Print :CFBundleExecutable',plist],{encoding:'utf8'}).trim();
          const cli=fs.realpathSync(path.join(process.env.HOME,'.local/bin/claude'));
          const sha=f=>crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          const git=(...a)=>cp.execFileSync('git',a,{encoding:'utf8'}).trim();
          const m={reviewedBy:'Teo W4.1620.4; source09fea recipe600s',admission:'W4.1509 process-cleanup030 ONE native run',hostedJobId:null,hostedJobUrl:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,source:root,sourceSha:git('rev-parse','HEAD'),sourceTree:git('rev-parse','HEAD^{tree}'),app,claude:cli,claudeSha256:sha(cli),asarSha256:sha(path.join(app,'Contents/Resources/app.asar')),executableSha256:sha(path.join(app,'Contents/MacOS',exe)),plistSha256:sha(plist),nodeVersion:process.version,model:'existing loopback scripted Claude SSE, fictional key',modelPort:47261,evidence:path.join(out,'actual')};
          if(m.sourceSha!=='24efa85d3c9b696029bce637a88499d87db5f0b5'||m.sourceTree!=='d122083bb0111b8df73f274e8cc003e1591f2386'||git('status','--porcelain'))throw Error('Source binding/cleanliness mismatch');
          fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify(m,null,2)+'\n');
          MANIFEST
      - name: ONE actual app worker end and normal native Quit (600s outer)
        env:
          TMPDIR: ${{ runner.temp }}/pt
        run: |
          mkdir -p "$TMPDIR"
          python3 - <<'RUN'
          import os,subprocess,json
          from pathlib import Path
          p=Path(os.environ['EVIDENCE']);code=124
          try:
            with (p/'native-console.log').open('wb') as f:
              r=subprocess.run(['node','scripts/gates/agent-processes/actual-app-orphans.mjs','--execute',str(p/'manifest.json')],stdout=f,stderr=subprocess.STDOUT,timeout=600)
              code=r.returncode
          except subprocess.TimeoutExpired:
            (p/'outer-timeout.txt').write_text('600s outer expired; incomplete cleanup remains unverified\n')
          (p/'native-exit.json').write_text(json.dumps({'exit':code,'outerSeconds':600})+'\n')
          print((p/'native-console.log').read_text(errors='replace'))
          raise SystemExit(code)
          RUN
      - name: Retain actual native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-native-actual-app
          path: |
            ${{ env.EVIDENCE }}/
            ${{ runner.temp }}/pt/
          if-no-files-found: error
          retention-days: 14

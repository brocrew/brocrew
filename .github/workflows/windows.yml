# Unsigned Windows x64 NSIS build. Runs on a `windows-beta-*` or `beta-*` tag (published as a
# prerelease on that tag), by hand, or on a develop/main push whose message has `+ci` or `+ci:windows`.
name: Windows build

on:
  push:
    branches: [develop, main]
    tags: ['windows-beta-*', 'beta-*']
  workflow_dispatch:
    inputs:
      package_version:
        description: Version stamped into the artifact-only Windows build
        type: string
        default: '0.1.8'

permissions:
  contents: read

env:
  # Electron and electron-builder downloads in one workspace folder, so one cache entry keeps them.
  # `electron_config_cache` is the name Electron's own install step reads.
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  flags:
    if: >-
      !startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-')
    name: Does this push ask for a Windows build?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      win: ${{ steps.flags.outputs.win }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: flags
        shell: bash
        run: |
          msg="$(git log -1 --pretty=%B)"
          if printf '%s' "$msg" | grep -qE '(^|[[:space:]])\+ci(:windows)?([[:space:]]|$)'; then
            win=true
          else
            win=false
          fi
          echo "win=$win" >> "$GITHUB_OUTPUT"
          echo "The head commit asks for a Windows build (+ci / +ci:windows): $win"

  windows:
    name: Build the Windows installer (NSIS, x64, unsigned)
    needs: flags
    if: >-
      !startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-') &&
      (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/windows-beta-') ||
        startsWith(github.ref, 'refs/tags/beta-') ||
        needs.flags.outputs.win == 'true'
      )
    # node-gyp 11 cannot find the Visual Studio on windows-latest.
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    # On the job, so a push that asks for no build cannot cancel a running one.
    concurrency:
      group: windows-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before packaging, which rebuilds the database module for Electron.
      - name: Recovery tests
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP//\\//}/recovery-tests.json"
          pnpm exec vitest run --project desktop test/recovery/ --reporter=default --reporter=json --outputFile.json="$report"
          node -e "const r = require(process.argv[1]); if (!(r.numTotalTests > 0 && r.numPassedTests > 0)) { console.error('The recovery tests collected no test.'); process.exit(1) } console.log(r.numPassedTests + ' recovery tests passed.')" "$report"

      - name: The third-party notices are up to date
        run: node scripts/third-party-notices.mjs --check

      - name: Build and package (NSIS, x64, unsigned)
        env:
          PACKAGE_VERSION: ${{ inputs.package_version || '0.1.8' }}
        shell: bash
        run: pnpm --filter @brobot2/desktop package:win "-c.extraMetadata.version=$PACKAGE_VERSION"

      - name: Install Claude Code (the newest tested version) outside the app
        id: claude
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/src/main/providers/claude/claude-code-tested.json').newest")"
          prefix="${RUNNER_TEMP//\\//}/claude-code"
          npm install --prefix "$prefix" --no-audit --no-fund "@anthropic-ai/claude-code@$version"
          program="$prefix/node_modules/@anthropic-ai/claude-code/bin/claude.exe"
          [ -f "$program" ] || { echo "npm installed Claude Code $version, and there is no $program"; exit 1; }
          echo "program=$program" >> "$GITHUB_OUTPUT"
          echo "Claude Code $version: $program"

      - name: Check the build (Codex and no Claude Code, the database module, the API key's way in, the data folder)
        env:
          BROBOT_CHECK_CLAUDE: ${{ steps.claude.outputs.program }}
        run: node scripts/windows-packaged-check.mjs apps/desktop/dist/win-unpacked

      - name: Name the installer by its commit
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          built=$(ls apps/desktop/dist/*.exe | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then label="$GITHUB_REF_NAME"; else label=$(git rev-parse --short=7 HEAD); fi
          named="apps/desktop/dist/$(basename "$built" .exe)-${label}.exe"
          mv "$built" "$named"
          echo "path=$named" >> "$GITHUB_OUTPUT"
          echo "Installer: $named ($(du -h "$named" | cut -f1))"

      - name: Keep the installer with this run
        continue-on-error: true # a full artifact quota must not fail a good build
        uses: actions/upload-artifact@v4
        with:
          name: brobot2-windows
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: The leak guard, patterns required
        if: >-
          startsWith(github.ref, 'refs/tags/windows-beta-') ||
          startsWith(github.ref, 'refs/tags/beta-')
        env:
          BROBOT_LEAK_PATTERNS: ${{ secrets.BROBOT_LEAK_PATTERNS }}
        shell: bash
        run: node scripts/leak-check.mjs --require-patterns

      - name: Publish a prerelease on the pushed tag
        if: >-
          startsWith(github.ref, 'refs/tags/windows-beta-') ||
          startsWith(github.ref, 'refs/tags/beta-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER: ${{ steps.installer.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          title="$(node scripts/beta-release.mjs title "$GITHUB_REF_NAME")"
          notes="$(node scripts/beta-release.mjs notes "$GITHUB_REF_NAME" "${GITHUB_SHA::7}")"
          [ -n "$title" ] && [ -n "$notes" ] || { echo "No title or notes for $GITHUB_REF_NAME"; exit 1; }
          # A `beta-*` tag's Mac job may have made the release already.
          if ! gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --title "$title" --notes "$notes"; then
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null
            echo "The release is already there (the other platform's build made it)."
          fi
          gh release upload "$GITHUB_REF_NAME" "$INSTALLER" --repo "$GITHUB_REPOSITORY" --clobber

  recovery-real-entry:
    name: Recovery real-entry check (Windows)
    needs: flags
    if: >-
      !startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-') &&
      (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/windows-beta-') ||
        startsWith(github.ref, 'refs/tags/beta-') ||
        needs.flags.outputs.win == 'true'
      )
    uses: ./.github/workflows/recovery-real-entry.yml
    with:
      runner: windows-2022
      evidence: recovery-evidence-windows

  plugin-v2-review:
    name: Plugin v2 Review (${{ matrix.app_version || 'off' }})
    if: github.repository == 'brocrew/brocrew' && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-')
    runs-on: windows-2022
    timeout-minutes: ${{ (startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') || startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-')) && 50 || 60 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app_version: ['0.1.7', '0.1.8']
    concurrency:
      group: plugin-v2-${{ github.ref }}-${{ matrix.app_version }}
      cancel-in-progress: false
    steps:
      - name: Preserve committed line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        id: gate-pnpm
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Plugin qualification source controls
        timeout-minutes: 2
        run: node --test --test-reporter=tap --test-concurrency=1 scripts/gates/plugin-v2/controls.test.mjs scripts/gates/plugin-v2/native-dependency.test.mjs scripts/gates/plugin-v2/reload-controls.test.mjs scripts/gates/plugin-v2/source-binding.test.mjs
      - name: Stage the tested source SHA
        if: ${{ !startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-') }}
        id: stage
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          control=$(node scripts/gates/plugin-v2/owner.mjs stage "${{ matrix.app_version }}")
          echo "control=$control" >> "$GITHUB_OUTPUT"
      - name: Install the selected app dependencies in scratch
        if: ${{ !startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-') }}
        shell: bash
        env:
          REVIEW_CONTROL: ${{ steps.stage.outputs.control }}
          PLUGIN_GATE_PNPM_ENTRY: ${{ steps.gate-pnpm.outputs.dest }}/node_modules/pnpm/bin/pnpm.cjs
        run: node scripts/gates/plugin-v2/owner.mjs install "$REVIEW_CONTROL"
      - name: Product HTTPS then projected package Review journey
        if: ${{ !startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-') }}
        shell: bash
        env:
          REVIEW_CONTROL: ${{ steps.stage.outputs.control }}
        run: node scripts/gates/plugin-v2/owner.mjs run "$REVIEW_CONTROL"
      - name: Stage dedicated main-app reload source (0.1.8)
        if: ${{ (matrix.app_version == '0.1.8') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-') }}
        id: reload-stage
        shell: bash
        run: |
          control=$(node scripts/gates/plugin-v2/reload-owner.mjs stage)
          echo "control=$control" >> "$GITHUB_OUTPUT"
      - name: Install dedicated reload dependencies in owned scratch
        if: ${{ (matrix.app_version == '0.1.8') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-') }}
        shell: bash
        env:
          REVIEW_CONTROL: ${{ steps.reload-stage.outputs.control }}
          PLUGIN_GATE_PNPM_ENTRY: ${{ steps.gate-pnpm.outputs.dest }}/node_modules/pnpm/bin/pnpm.cjs
        run: node scripts/gates/plugin-v2/owner.mjs install "$REVIEW_CONTROL"
      - name: Controlled main-app reload queue (0.1.8)
        if: ${{ (matrix.app_version == '0.1.8') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-') }}
        shell: bash
        env:
          REVIEW_CONTROL: ${{ steps.reload-stage.outputs.control }}
        run: node scripts/gates/plugin-v2/reload-owner.mjs run "$REVIEW_CONTROL"
      - name: Keep controlled main-app reload evidence
        if: ${{ (always() && steps.reload-stage.outputs.control != '') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-') }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-reload-windows-0.1.8
          path: ${{ steps.reload-stage.outputs.control }}/reload-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Keep the product check summary
        if: ${{ (always() && steps.stage.outputs.control != '') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') && !startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-') }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-v2-windows-${{ matrix.app_version }}
          path: ${{ steps.stage.outputs.control }}/summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Assert installed SDK role scope
        id: sdk-scope
        if: ${{ (startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') || startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-')) }}
        timeout-minutes: 1
        shell: bash
        run: node scripts/gates/plugin-v2/owner.mjs sdk-scope "${{ matrix.app_version }}"
      - name: Stage owned installed SDK reload source
        id: sdk-stage
        if: ${{ matrix.app_version == '0.1.8' && (startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') || startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-')) }}
        timeout-minutes: 4
        shell: bash
        env:
          PLUGIN_SDK_APP_VERSION: ${{ matrix.app_version }}
        run: |
          control=$(node scripts/gates/plugin-v2/owner.mjs sdk-stage)
          echo "control=$control" >> "$GITHUB_OUTPUT"
      - name: Install pinned installed SDK probe dependencies
        id: sdk-install
        if: ${{ matrix.app_version == '0.1.8' && (startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') || startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-')) }}
        timeout-minutes: 21
        shell: bash
        env:
          PLUGIN_SDK_APP_VERSION: ${{ matrix.app_version }}
          SDK_CONTROL: ${{ steps.sdk-stage.outputs.control }}
          PLUGIN_GATE_PNPM_ENTRY: ${{ steps.gate-pnpm.outputs.dest }}/node_modules/pnpm/bin/pnpm.cjs
        run: node scripts/gates/plugin-v2/owner.mjs sdk-install "$SDK_CONTROL"
      - name: Installed SDK start and reload probe
        id: sdk-probe
        if: ${{ matrix.app_version == '0.1.8' && (startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') || startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-')) }}
        timeout-minutes: 16
        shell: bash
        env:
          PLUGIN_SDK_APP_VERSION: ${{ matrix.app_version }}
          SDK_CONTROL: ${{ steps.sdk-stage.outputs.control }}
        run: node scripts/gates/plugin-v2/owner.mjs sdk-run "$SDK_CONTROL"
      - name: Keep closed installed SDK reload evidence
        id: sdk-evidence
        if: ${{ always() && matrix.app_version == '0.1.8' && (startsWith(github.ref, 'refs/heads/gate/plugin-v2-mac-sdk-') || startsWith(github.ref, 'refs/heads/gate/plugin-v2-windows-sdk-')) && steps.sdk-stage.outputs.control != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: sdk-reload-windows-0.1.8
          path: ${{ steps.sdk-stage.outputs.control }}/sdk-summary.json
          if-no-files-found: error
          retention-days: 7

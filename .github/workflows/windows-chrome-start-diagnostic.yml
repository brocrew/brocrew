name: Windows published Chrome startup DIAGNOSTIC
on:
  push:
    branches: [diagnostic/windows-chrome-start-0211]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '42407090126'
          name: brobot2-windows
          path: installer
      - name: Install exact early candidate on disposable runner without launching it
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence | Out-Null
          $installers = @(Get-ChildItem installer -Recurse -Filter '*Setup*.exe')
          if ($installers.Count -ne 1) { throw 'expected one installer' }
          $exe = $installers[0].FullName
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if ($hash -ne 'acc9610f51ce2ce3b4a9e1479d7694b8720f4d9702c856eca294bb61f60956f5') { throw 'installer hash differs' }
          $hash | Set-Content evidence/installer-sha256.txt
          $installed = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "installer exit $($installed.ExitCode)" }
      - name: Fetch exact published Windows Chrome archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.8 --repo brocrew/brocrew-plugin-chrome --pattern chrome-win32-x64.tar.gz --dir .
      - name: Capture published server stderr and exit using packaged runtime and preload
        shell: pwsh
        run: |
          $resources = Join-Path $env:LOCALAPPDATA 'Programs/BroCrew/resources'
          node windows-chrome-start-diagnostic.mjs $resources chrome-win32-x64.tar.gz evidence current-011
          if ($LASTEXITCODE -ne 0) { throw "diagnostic driver exit $LASTEXITCODE" }
          node windows-chrome-start-diagnostic.mjs $resources chrome-win32-x64.tar.gz evidence old-0136
          if ($LASTEXITCODE -ne 0) { throw "diagnostic driver exit $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-chrome-start-diagnostic
          path: evidence
          if-no-files-found: error
          retention-days: 7

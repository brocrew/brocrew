# Private, disposable offline install proof. No signing key, token or provider account.
name: Packaged Chrome plugin gate
on:
  push:
    branches: ['gate/plugin-packaged-*']
permissions:
  contents: read
jobs:
  packaged:
    if: >-
      github.repository == 'brocrew/brocrew' &&
      startsWith(github.ref, 'refs/heads/gate/plugin-packaged-')
    runs-on: macos-15-xlarge
    timeout-minutes: 45
    concurrency:
      group: plugin-packaged-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Refuse self-hosted runners
        shell: bash
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - name: Retain the release toolchain path
        shell: bash
        run: echo "PLUGIN_GATE_NODE22=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Create owned scratch roots and an isolated checkout
        run: node scripts/gates/plugin-packaged/owner.mjs init
      - name: Build, measure V0–V4, and exercise the packaged app under the independent owner
        shell: bash
        run: node scripts/gates/plugin-packaged/owner.mjs run "$PLUGIN_GATE_CONTROL" "$PLUGIN_GATE_NODE22" "$(command -v pnpm)"
      - name: Best-effort drain; hosted VM teardown is the final boundary
        if: always() && env.PLUGIN_GATE_CONTROL != ''
        run: node scripts/gates/plugin-packaged/owner.mjs clean "$PLUGIN_GATE_CONTROL"
      - name: Keep only the sanitized gate summary
        if: always() && env.PLUGIN_GATE_CONTROL != ''
        uses: actions/upload-artifact@v4
        with:
          name: plugin-packaged-summary
          path: ${{ env.PLUGIN_GATE_CONTROL }}/summary.json
          if-no-files-found: error
          retention-days: 7

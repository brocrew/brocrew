name: Build a signed Mac distribution
description: Build, notarize and check final Mac update files without publication
inputs:
  version:
    required: true
    description: Stable package version for this artifact
  owner:
    required: true
    description: Update repository owner
  repo:
    required: true
    description: Update repository name
  artifact_name:
    required: true
    description: Distinct immutable artifact name
outputs:
  artifact_id:
    description: Immutable artifact ID
    value: ${{ steps.assets.outputs.artifact-id }}
  artifact_digest:
    description: Artifact transport SHA256
    value: ${{ steps.assets.outputs.artifact-digest }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-desktop
    - name: The third-party notices are up to date
      shell: bash
      run: node scripts/third-party-notices.mjs --check
    - name: Prepare temporary signing credentials
      shell: bash
      env:
        MAC_CERT_P12_BASE64: ${{ env.MAC_CERT_P12_BASE64 }}
        MAC_CERT_P12_PASSWORD: ${{ env.MAC_CERT_P12_PASSWORD }}
        APPLE_API_KEY_P8: ${{ env.APPLE_API_KEY_P8 }}
        APPLE_API_KEY_ID: ${{ env.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
      run: |
        set -euo pipefail
        umask 077
        for name in MAC_CERT_P12_BASE64 MAC_CERT_P12_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
          [ -n "${!name}" ] || { echo "Missing $name"; exit 1; }
        done
        node scripts/lib/mac-signing-identity.mjs mask
        signing_dir="$RUNNER_TEMP/mac-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        mkdir "$signing_dir"
        keychain="$signing_dir/release.keychain-db"
        keychain_password="$(openssl rand -hex 32)"
        echo "::add-mask::$keychain_password"
        printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$signing_dir/certificate.p12"
        printf '%s' "$APPLE_API_KEY_P8" > "$signing_dir/notary.p8"
        export SIGNING_DIR="$signing_dir"
        node <<'NODE'
        const { execFileSync } = require('node:child_process')
        const { writeFileSync } = require('node:fs')
        const { join } = require('node:path')
        const original = execFileSync('security', ['list-keychains', '-d', 'user'], { encoding: 'utf8' })
          .split('\n').filter((line) => line.trim()).map((line) => {
            const match = /^\s*"(.*)"\s*$/.exec(line)
            if (!match) throw new Error('Cannot preserve the user keychain search list')
            return match[1]
          })
        writeFileSync(join(process.env.SIGNING_DIR, 'keychain-search-list.json'), JSON.stringify(original), { flag: 'wx', mode: 0o600 })
        NODE
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 7200 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$signing_dir/certificate.p12" -k "$keychain" -P "$MAC_CERT_P12_PASSWORD" -T /usr/bin/codesign
        rm "$signing_dir/certificate.p12"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
        node <<'NODE'
        const { execFileSync } = require('node:child_process')
        const { readFileSync } = require('node:fs')
        const { join } = require('node:path')
        const keychain = join(process.env.SIGNING_DIR, 'release.keychain-db')
        const original = JSON.parse(readFileSync(join(process.env.SIGNING_DIR, 'keychain-search-list.json'), 'utf8'))
        execFileSync('security', ['list-keychains', '-d', 'user', '-s', keychain, ...original.filter((entry) => entry !== keychain)])
        NODE
        identity="$(security find-identity -v -p codesigning "$keychain" | node scripts/lib/mac-signing-identity.mjs)"
        [[ "$identity" =~ ^[A-F0-9]{40}$ ]] || { echo 'Exactly one Developer ID identity for the release team is required'; exit 1; }
        {
          echo "CSC_KEYCHAIN=$keychain"
          echo "CSC_NAME=$identity"
          echo "MAC_SIGNING_IDENTITY=$identity"
          echo "APPLE_API_KEY=$signing_dir/notary.p8"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          echo "MAC_SIGNING_EVIDENCE=$RUNNER_TEMP/mac-signing-evidence"
        } >> "$GITHUB_ENV"
    - name: Build and package (app stapled before dmg and updater zip)
      shell: bash
      run: |
        set -euo pipefail
        pnpm --filter @brobot2/desktop run build
        pnpm --filter @brobot2/desktop exec electron-builder --mac dmg zip dir --arm64 --config electron-builder.yml \
          -c.forceCodeSigning=true -c.mac.hardenedRuntime=true \
          -c.mac.timestamp=http://timestamp.apple.com/ts01 -c.mac.notarize=false \
          -c.afterSign=./build/mac-after-sign.cjs \
          -c.extraMetadata.version=${{ inputs.version }} \
          -c.publish.provider=github -c.publish.owner=${{ inputs.owner }} -c.publish.repo=${{ inputs.repo }} \
          --publish never
        node scripts/mac-release-signing.mjs apps/desktop/dist ${{ inputs.version }}
      # The app carries no Claude Code: the check runs the newest tested one, installed with npm
      # outside the app, as `macos.yml` does.
    - name: Install Claude Code (the newest tested version) outside the app
      id: claude
      shell: bash
      run: node scripts/install-tested-claude.mjs

    - name: Check signed app, nested code, stapled DMG and updater ZIP, and packaged behavior
      env:
        BROBOT_CHECK_CLAUDE: ${{ steps.claude.outputs.program }}
      shell: bash
      run: node scripts/macos-packaged-check.mjs apps/desktop/dist/mac-arm64/BroCrew.app apps/desktop/dist/BroCrew-${{ inputs.version }}-arm64.dmg --developer-id apps/desktop/dist/BroCrew-${{ inputs.version }}-arm64-mac.zip
    - name: Check the update files (version, sizes, sha512, where the app looks)
      shell: bash
      run: node scripts/release-check.mjs apps/desktop/dist ${{ inputs.version }} ${{ inputs.owner }}/${{ inputs.repo }} apps/desktop/dist/mac-arm64/BroCrew.app/Contents/Resources/app-update.yml
    - name: Recovery real-entry check
      shell: bash
      env:
        BROBOT_RECOVERY_EVIDENCE: ${{ runner.temp }}/recovery-evidence
      run: node scripts/recovery-real-entry-check.mjs --packaged apps/desktop/dist/mac-arm64/BroCrew.app/Contents/MacOS/BroCrew
    - name: Keep what the recovery check saw
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: recovery-evidence-${{ inputs.artifact_name }}
        path: ${{ runner.temp }}/recovery-evidence
        if-no-files-found: warn
        retention-days: 30
    - name: Keep signature and notary evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: signing-evidence-${{ inputs.artifact_name }}
        path: ${{ runner.temp }}/mac-signing-evidence
        if-no-files-found: warn
        retention-days: 30
    - name: Remove temporary signing credentials
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        signing_dir="$RUNNER_TEMP/mac-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        export SIGNING_DIR="$signing_dir"
        status=0
        if [ -f "$signing_dir/keychain-search-list.json" ]; then
          node <<'NODE' || status=$?
        const { execFileSync } = require('node:child_process')
        const { readFileSync } = require('node:fs')
        const { join } = require('node:path')
        const original = JSON.parse(readFileSync(join(process.env.SIGNING_DIR, 'keychain-search-list.json'), 'utf8'))
        execFileSync('security', ['list-keychains', '-d', 'user', '-s', ...original])
        NODE
        fi
        if [ -e "$signing_dir/release.keychain-db" ]; then
          security delete-keychain "$signing_dir/release.keychain-db" || status=$?
        fi
        rm -rf "$signing_dir" || status=$?
        exit "$status"
    - name: Record the final candidate file inventory
      shell: bash
      run: |
        set -euo pipefail
        export SOURCE_TREE="$(git rev-parse HEAD^{tree})"
        node scripts/release-artifacts.mjs mac-receipt apps/desktop/dist ${{ inputs.version }}
    - id: assets
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: |
          apps/desktop/dist/BroCrew-${{ inputs.version }}-arm64.dmg
          apps/desktop/dist/BroCrew-${{ inputs.version }}-arm64.dmg.blockmap
          apps/desktop/dist/BroCrew-${{ inputs.version }}-arm64-mac.zip
          apps/desktop/dist/BroCrew-${{ inputs.version }}-arm64-mac.zip.blockmap
          apps/desktop/dist/latest-mac.yml
          apps/desktop/dist/mac-signed-candidate.json
        if-no-files-found: error
        retention-days: 30

packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 blocks lifecycle build scripts by default. These build/download on install:
#   - better-sqlite3: compiles/downloads the native SQLite binding
#   - esbuild:        downloads its platform binary (used by electron-vite/vitest)
#   - electron:       ⚠️ listed, and it has NO install script to allow (not the pinned 43, and
#                     not 42 before it) — it downloads lazily, on the first `require('electron')`. electron-vite reads
#                     `path.txt` itself and throws "Electron uninstall" instead of triggering
#                     that, so a fresh worktree could not launch the app (680 F15). The
#                     download is `apps/desktop`'s own `postinstall` now (695), running
#                     Electron's `install.js`, which exits at once when the binary is there;
#                     `ELECTRON_SKIP_BINARY_DOWNLOAD=1` (Electron's own convention) skips it.
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
